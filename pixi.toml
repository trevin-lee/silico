[workspace]
name = "silico"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

# The pinned C++ toolchain. Determinism depends on every machine compiling
# worker C++ with the same compiler (ARCHITECTURE.md, Deterministic kernel).
[dependencies]
clangxx = "21.1.8.*"
# Runtime and headers pinned together: OCCT calls libc++ (std::sort, ...) at runtime.
libcxx = "21.1.8.*"
libcxx-devel = "21.1.8.*"
cmake = ">=3.28,<5"
ninja = "*"
# flock for the shared OCCT build cache (macOS has no flock command).
perl = "5.*"
# Banned dependencies, licenses, and sources, checked by the gate.
cargo-deny = "0.20.*"

# On macOS, linking uses Apple's ld: lld 21 can't read the macOS 27 SDK.
[target.linux-64.dependencies]
lld = "21.*"
# Rewrites OCCT's library search path so a cached build is shared between checkouts.
patchelf = "*"
# The pool's descriptor tests list a worker's open descriptors (macOS has lsof built in).
lsof = "*"

[tasks]
occt = { cmd = "bash third_party/occt/build.sh", description = "Fetch, verify, patch, and build OCCT with the deterministic recipe" }
stress = { cmd = "bash third_party/occt/scripts/stress.sh", depends-on = ["occt"], description = "Run the 605-case stress test 10 times; each run must match the reference byte for byte" }
test-guards = { cmd = "bash third_party/occt/scripts/test-guards.sh", depends-on = ["occt"], description = "Prove every OCCT build guard rejects bad input" }
test-cache = { cmd = "bash third_party/occt/scripts/test-cache.sh", description = "Prove the shared OCCT build cache keeps, replaces, and removes entries as documented" }
# The libm shim is outside the workspace (its own profile), so it gets its own Cargo
# target dir, target/libm-shim, for tests and lint. The OCCT build compiles it in a
# temporary directory inside the shared build cache.
shim-test = { cmd = "CARGO_TARGET_DIR=target/libm-shim cargo test --manifest-path third_party/occt/libm-shim/Cargo.toml", description = "Test the libm shim against known values and the platform library" }
build = { cmd = "cargo build --workspace", depends-on = ["occt"] }
# FreeCAD for the oracle tests (M0.8 on), installed on first use.
install-oracle = { cmd = "pixi install -e oracle", description = "Install the FreeCAD oracle environment" }
install-viewer = { cmd = "pixi install -e viewer", description = "Install the Rerun viewer" }
view = { cmd = "cargo build -p silico-kernel --bin silico-kernel-worker && cargo run -p silico-view -- --viewer .pixi/envs/viewer/bin/rerun", depends-on = ["occt", "install-viewer"], description = "Show the kernel's parts (a box, fillets, the primitives) in the Rerun viewer" }
test = { cmd = "cargo nextest run --workspace", depends-on = ["occt", "install-oracle", "shim-test", "test-guards", "test-cache"] }
oracle = { cmd = "cargo build -p silico-kernel --bin silico-kernel-worker && cargo run -p silico-oracle -- run tests/oracle", depends-on = ["occt", "install-oracle"], description = "Compare every case in tests/oracle with FreeCAD" }
oracle-sweep = { cmd = "cargo build -p silico-kernel --bin silico-kernel-worker && cargo run -p silico-oracle -- sweep --count 500", depends-on = ["occt", "install-oracle"], description = "Compare 500 generated cases with FreeCAD (pass --seed S to vary them)" }
corpus = { cmd = "bash tests/corpus/run.sh", depends-on = ["occt", "install-oracle"], description = "Download real parts (NIST's STEP files) once, and compare them with FreeCAD" }
# Every check on the committed tree; must pass before a merge.
gate = { cmd = "bash tests/gate.sh", description = "Run every check on the committed tree" }
lint = { cmd = "cargo fmt --check && cargo fmt --check --manifest-path third_party/occt/libm-shim/Cargo.toml && cargo clippy --workspace --all-targets -- -D warnings && CARGO_TARGET_DIR=target/libm-shim cargo clippy --manifest-path third_party/occt/libm-shim/Cargo.toml --release --all-targets -- -D warnings", depends-on = ["occt"] }

# FreeCAD, for oracle tests: the FreeCAD Silico references, on the same OCCT release as
# Silico's own (ARCHITECTURE.md). Pinned, so a re-solve can't move either: they move
# together, deliberately. Oracle comparisons still use tolerances (Silico's recipe changes
# the last bits).
[feature.oracle]
platforms = ["osx-arm64", "linux-64"]

[feature.oracle.dependencies]
freecad = "==1.1.3"
occt = "==7.9.3"

# The Rerun viewer, for silico-view (pixi run view). Same version as the rerun crate.
[feature.viewer]
platforms = ["osx-arm64", "linux-64"]

[feature.viewer.dependencies]
rerun-sdk = "==0.38.1"

[environments]
oracle = { features = ["oracle"], no-default-feature = true }
viewer = { features = ["viewer"], no-default-feature = true }
