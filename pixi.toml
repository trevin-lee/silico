[workspace]
name = "silico"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

# The pinned C++ toolchain. Determinism depends on every machine compiling
# worker C++ with the same compiler (ARCHITECTURE.md, Deterministic kernel).
[dependencies]
# The compiler's build pinned too (clangxx and clang-21, the compiler itself): adding
# M4.6's lavapipe once moved the Mac's from build 6 to 7, which would change what OCCT is
# compiled with. libclang13, the C API clang-scan-deps uses, is left free: it compiles
# nothing.
clangxx = { version = "21.1.8.*", build = "*_6" }
clang-21 = { version = "21.1.8.*", build = "*_6" }
# Runtime and headers pinned together: OCCT calls libc++ (std::sort, ...) at runtime.
libcxx = "21.1.8.*"
libcxx-devel = "21.1.8.*"
cmake = ">=3.28,<5"
ninja = "*"
# flock for the shared OCCT build cache (macOS has no flock command).
perl = "5.*"
# Banned dependencies, licenses, and sources, checked by the gate.
cargo-deny = "0.20.*"
# Headers PlaneGCS builds against (silico-sketch), the versions FreeCAD 1.1.3, the oracle,
# bundles: Eigen for its algebra, and Boost.Graph for one connected-components call.
eigen = "==3.4.0"
libboost-headers = "==1.86.0"
# Mesa's software rasterizer and the Vulkan loader for the render worker (silico-render,
# M4.6: docs/design/m4.6-render.md). Not under the deterministic recipe: the render worker's
# pixels aren't results (ARCHITECTURE.md, Deterministic kernel). Its build compiles these
# paths in, so nothing here sets a loader variable for other programs.
mesa-lavapipe = "==26.2.5"
libvulkan-loader = "1.4.*"
# The filler's decisions' tests (tests/filler-decisions.sh) answer GitHub's API through jq.
jq = ">=1.8.2,<2"

# mesa-lavapipe's macOS builds (the render worker's rasterizer) need macOS 15 or later. The
# table pixi 0.81 calls deprecated, kept: its replacement renames the platform every feature
# lists.
[system-requirements]
macos = "15.0"

# On macOS, linking uses Apple's ld: lld 21 can't read the macOS 27 SDK.
[target.linux-64.dependencies]
lld = "21.*"
# Rewrites OCCT's library search path so a cached build is shared between checkouts.
patchelf = "*"
# The pool's descriptor tests list a worker's open descriptors (macOS has lsof built in).
lsof = "*"

[tasks]
occt = { cmd = "bash third_party/occt/build.sh", description = "Fetch, verify, patch, and build OCCT with the deterministic recipe" }
stress = { cmd = "bash third_party/occt/scripts/stress.sh", depends-on = ["occt"], description = "Run the 605-case stress test 10 times; each run must match the reference byte for byte" }
test-guards = { cmd = "bash third_party/occt/scripts/test-guards.sh", depends-on = ["occt"], description = "Prove every OCCT build guard rejects bad input" }
test-cache = { cmd = "bash third_party/occt/scripts/test-cache.sh", description = "Prove the shared OCCT build cache keeps, replaces, and removes entries as documented" }
test-ci-decisions = { cmd = "bash tests/filler-decisions.sh", description = "Prove the filler's decisions (filler.yml, proptest-room.sh) against made-up states of the CI" }
# The libm shim is outside the workspace (its own profile), so it gets its own Cargo
# target dir, target/libm-shim, for tests and lint. The OCCT build compiles it in a
# temporary directory inside the shared build cache.
shim-test = { cmd = "CARGO_TARGET_DIR=target/libm-shim cargo test --manifest-path third_party/occt/libm-shim/Cargo.toml", description = "Test the libm shim against known values and the platform library" }
build = { cmd = "cargo build --workspace", depends-on = ["occt"] }
# The app starts only with its four workers beside it, so every binary is built first.
app = { cmd = "cargo build --release --workspace --bins && cargo run --release -p silico-app", depends-on = ["occt"], description = "Build Silico and open the app" }
# FreeCAD for the oracle tests (M0.8 on), installed on first use.
install-oracle = { cmd = "pixi install -e oracle", description = "Install the FreeCAD oracle environment" }
install-viewer = { cmd = "pixi install -e viewer", description = "Install the Rerun viewer" }
view = { cmd = "cargo build -p silico-kernel --bin silico-kernel-worker && cargo run -p silico-view -- --viewer .pixi/envs/viewer/bin/rerun", depends-on = ["occt", "install-viewer"], description = "Show the kernel's parts (a box, fillets, the primitives) in the Rerun viewer" }
planegcs-verify = { cmd = "bash third_party/planegcs/scripts/verify.sh", description = "Prove third_party/planegcs is FreeCAD 1.1.3's PlaneGCS with exactly its patch series" }
# One seed for every property test (proptest's PROPTEST_RNG_SEED), so every gate meets the
# same cases, and a property can't fail a pull request that didn't touch it with cases no gate
# met before. Keep it equal to the mutants task's (below): a green gate means a green mutants
# baseline. It overrides the seed a test's config fixes in `proptest!` (proptest lets the
# variable win; only a TestRunner made directly with a seed keeps its own), and a task's env
# overrides the caller's (pixi 0.81): to try another seed, run
# `PROPTEST_RNG_SEED=S pixi run cargo nextest run ...`. The seed is printed first, so a
# failure in a block that fixes its own can be run again at the gate's. New seeds are
# explored on idle runners (.github/workflows/proptest-explore.yml, `pixi run
# proptest-explore`).
test = { cmd = "echo \"test: PROPTEST_RNG_SEED=$PROPTEST_RNG_SEED\" && cargo nextest run --workspace", depends-on = ["occt", "install-oracle", "shim-test", "test-guards", "test-cache", "test-ci-decisions", "planegcs-verify"], env = { PROPTEST_RNG_SEED = "20261021" } }
oracle = { cmd = "cargo build -p silico-kernel --bin silico-kernel-worker --bin silico-step-worker && cargo build -p silico-sketch --bin silico-sketch-worker && cargo run -p silico-oracle -- run tests/oracle", depends-on = ["occt", "install-oracle"], description = "Compare every case in tests/oracle with FreeCAD" }
oracle-sweep = { cmd = "cargo build -p silico-kernel --bin silico-kernel-worker && cargo run -p silico-oracle -- sweep --count 500", depends-on = ["occt", "install-oracle"], description = "Compare 500 generated cases with FreeCAD (pass --seed S to vary them)" }
oracle-sketch-edit-sweep = { cmd = "cargo build -p silico-sketch --bin silico-sketch-worker && cargo run -p silico-oracle -- sketch-edit-sweep --count 500", depends-on = ["occt", "install-oracle"], description = "Compare 500 generated sketch edits with FreeCAD's (pass --seed S to vary them)" }
oracle-sketch-extend-sweep = { cmd = "cargo build -p silico-sketch --bin silico-sketch-worker && cargo run -p silico-oracle -- sketch-extend-sweep --count 500", depends-on = ["occt", "install-oracle"], description = "Compare 500 generated sketch extends with FreeCAD's (pass --seed S to vary them)" }
corpus = { cmd = "bash tests/corpus/run.sh", depends-on = ["occt", "install-oracle"], description = "Download real parts (NIST's STEP files) once, and compare them with FreeCAD" }
# Every check on the committed tree; must pass before a merge.
gate = { cmd = "bash tests/gate.sh", description = "Run every check on the committed tree" }
# The test task's seed (above): keep the two equal, so a green gate means a green mutants
# baseline, and each mutant meets the cases the gate met (.github/workflows/mutants.yml).
mutants = { cmd = "bash tests/mutants.sh", description = "Mutation testing on the committed tree, in the gate's worktree (pass cargo mutants arguments, absolute paths)", env = { PROPTEST_RNG_SEED = "20261021" } }
# No seed of its own: it draws a new one for each round, or takes one as its second argument.
proptest-explore = { cmd = "bash tests/proptest-explore.sh", description = "Run the workspace's tests on the committed tree with new proptest seeds, in rounds (pass an absolute output directory, and a seed to repeat one)" }
lint = { cmd = "cargo fmt --check && cargo fmt --check --manifest-path third_party/occt/libm-shim/Cargo.toml && cargo clippy --workspace --all-targets -- -D warnings && CARGO_TARGET_DIR=target/libm-shim cargo clippy --manifest-path third_party/occt/libm-shim/Cargo.toml --release --all-targets -- -D warnings", depends-on = ["occt"] }

# FreeCAD, for oracle tests: the FreeCAD Silico references, on the same OCCT release as
# Silico's own (ARCHITECTURE.md). Pinned, so a re-solve can't move either: they move
# together, deliberately. Oracle comparisons still use tolerances (Silico's recipe changes
# the last bits).
[feature.oracle]
platforms = ["osx-arm64", "linux-64"]

[feature.oracle.dependencies]
freecad = "==1.1.3"
occt = "==7.9.3"

# The Rerun viewer, for silico-view (pixi run view). Same version as the rerun crate.
[feature.viewer]
platforms = ["osx-arm64", "linux-64"]

[feature.viewer.dependencies]
rerun-sdk = "==0.38.1"

[environments]
oracle = { features = ["oracle"], no-default-feature = true }
viewer = { features = ["viewer"], no-default-feature = true }
