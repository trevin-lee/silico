# Checked by the gate (pixi run gate): cargo deny check bans licenses sources. Advisories
# are checked daily on main instead ([advisories] below).

[graph]
# Optional features too, so a feature-gated dependency can't slip past.
all-features = true

[bans]
multiple-versions = "allow"
# No C++ in the app process (ARCHITECTURE.md, invariant 1): only the worker crates,
# silico-kernel (OCCT) and silico-sketch (PlaneGCS), may reach C++ and the cxx bridge
# machinery. A crate depending on either would also get its C++ without the libm shim,
# breaking determinism. (Each lists itself: its tests depend on it with the test_ops
# feature.)
deny = [
    { crate = "silico-kernel", wrappers = ["silico-kernel"], reason = "only the kernel links OCCT; other crates reach it through the worker" },
    { crate = "silico-sketch", wrappers = ["silico-sketch"], reason = "only the sketch worker links PlaneGCS; other crates reach it through the worker" },
    { crate = "cxx", wrappers = ["silico-kernel", "silico-sketch"], reason = "C++ belongs in worker crates only" },
    { crate = "cxx-build", wrappers = ["silico-kernel", "silico-sketch"], reason = "C++ belongs in worker crates only" },
    { crate = "link-cplusplus", wrappers = ["cxx"], reason = "C++ belongs in worker crates only" },
    # Only the crates that draw: the render worker and the app (M5 decision 13a). A crate
    # linking the renderer would load a GPU driver into its own process, so the core, the
    # MCP server, and the CLI never do (docs/design/m4.6-render.md).
    # The app reaches it only through silico-render, so the viewport and agents' renders
    # draw on one path (M4.6's R1).
    { crate = "re_renderer", wrappers = ["silico-render"], reason = "only silico-render draws with re_renderer: the render worker, and the app through it" },
    # eframe depends on wgpu itself only for wasm32, and egui_kittest through its wgpu
    # feature (the app's tests'); the graph takes every target and feature, so both are
    # wgpu's direct parents in the app's tree, as egui-wgpu is.
    # The window's crates belong to the app alone, and egui-wgpu to the window crates that
    # draw with it, so no other crate links a windowing or GPU stack in unseen.
    { crate = "eframe", wrappers = ["silico-app"], reason = "only the app opens a window" },
    { crate = "egui_kittest", wrappers = ["silico-app"], reason = "only the app's tests drive a window" },
    { crate = "egui-wgpu", wrappers = ["eframe", "egui_kittest"], reason = "only the window crates draw with wgpu" },
    { crate = "wgpu", wrappers = ["silico-render", "re_renderer", "silico-app", "egui-wgpu", "eframe", "egui_kittest"], reason = "only the crates that draw: the render worker and the app" },
]

[licenses]
# Compatible with Silico's GPL-3.0-or-later.
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    # Silico's own crates.
    "GPL-3.0-or-later",
    "CC0-1.0",
    # A permissive data license: webpki-roots (Mozilla's list of certificate authorities),
    # used by Rerun's network code (silico-view only).
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# Inter, the app's one font (M5 decision 13b): OFL-1.1 for the crate that ships it alone, so
# no other crate brings a font licence in unseen. egui's default fonts (Ubuntu-font-1.0) are
# off, so that licence never enters.
exceptions = [
    { crate = "silico-font", allow = ["OFL-1.1"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
# Checked daily on main by .github/workflows/advisories.yml, not by the gate (it needs the
# network; M5 decision 13c): a new advisory fails that run, and is fixed by a follow-up
# that ignores it here with its reason, or replaces the crate.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained, not vulnerable; it comes in through the rerun crate (silico-view only)" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant is unmaintained (as a crate of its own), reached only through eframe's Linux screen-reader bridge (accesskit_unix); not a vulnerability" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names is unmaintained (as a crate of its own), reached only through eframe's Linux screen-reader bridge (accesskit_unix); not a vulnerability" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is unmaintained (as a crate of its own), reached only through eframe's Linux screen-reader bridge (accesskit_unix); not a vulnerability" },
]
