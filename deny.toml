# Checked by the gate (pixi run gate): cargo deny check bans licenses sources.

[graph]
# Optional features too, so a feature-gated dependency can't slip past.
all-features = true

[bans]
multiple-versions = "allow"
# No C++ in the app process (ARCHITECTURE.md, invariant 1): only the worker crates,
# silico-kernel (OCCT) and silico-sketch (PlaneGCS), may reach C++ and the cxx bridge
# machinery. A crate depending on either would also get its C++ without the libm shim,
# breaking determinism. (Each lists itself: its tests depend on it with the test_ops
# feature.)
deny = [
    { crate = "silico-kernel", wrappers = ["silico-kernel"], reason = "only the kernel links OCCT; other crates reach it through the worker" },
    { crate = "silico-sketch", wrappers = ["silico-sketch"], reason = "only the sketch worker links PlaneGCS; other crates reach it through the worker" },
    { crate = "cxx", wrappers = ["silico-kernel", "silico-sketch"], reason = "C++ belongs in worker crates only" },
    { crate = "cxx-build", wrappers = ["silico-kernel", "silico-sketch"], reason = "C++ belongs in worker crates only" },
    { crate = "link-cplusplus", wrappers = ["cxx"], reason = "C++ belongs in worker crates only" },
]

[licenses]
# Compatible with Silico's GPL-3.0-or-later.
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    # Silico's own crates.
    "GPL-3.0-or-later",
    "CC0-1.0",
    # A permissive data license: webpki-roots (Mozilla's list of certificate authorities),
    # used by Rerun's network code (silico-view only).
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
# Not run by the gate yet (it needs the network); recorded for when it is.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained, not vulnerable; it comes in through the rerun crate (silico-view only)" },
]
