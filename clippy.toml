allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

# Platform math libraries differ in their last bits, so Silico's own math uses
# the pure-Rust `libm` crate for anything that isn't correctly rounded by IEEE 754.
# `sqrt`, `mul_add`, and basic arithmetic are exact everywhere and stay allowed.
disallowed-methods = [
    { path = "f64::sin", reason = "not bit-identical across platforms; use the libm crate" },
    { path = "f64::cos", reason = "not bit-identical across platforms; use the libm crate" },
    { path = "f64::tan", reason = "not bit-identical across platforms; use the libm crate" },
    { path = "f64::asin", reason = "not bit-identical across platforms; use the libm crate" },
    { path = "f64::acos", reason = "not bit-identical across platforms; use the libm crate" },
    { path = "f64::atan", reason = "not bit-identical across platforms; use the libm crate" },
    { path = "f64::atan2", reason = "not bit-identical across platforms; use the libm crate" },
    { path = "f64::sin_cos", reason = "not bit-identical across platforms; use the libm crate" },
    { path = "f64::sinh", reason = "not bit-identical across platforms; use the libm crate" },
    { path = "f64::cosh", reason = "not bit-identical across platforms; use the libm crate" },
    { path = "f64::tanh", reason = "not bit-identical across platforms; use the libm crate" },
    { path = "f64::asinh", reason = "not bit-identical across platforms; use the libm crate" },
    { path = "f64::acosh", reason = "not bit-identical across platforms; use the libm crate" },
    { path = "f64::atanh", reason = "not bit-identical across platforms; use the libm crate" },
    { path = "f64::exp", reason = "not bit-identical across platforms; use the libm crate" },
    { path = "f64::exp2", reason = "not bit-identical across platforms; use the libm crate" },
    { path = "f64::exp_m1", reason = "not bit-identical across platforms; use the libm crate" },
    { path = "f64::ln", reason = "not bit-identical across platforms; use the libm crate" },
    { path = "f64::log", reason = "not bit-identical across platforms; use the libm crate" },
    { path = "f64::log2", reason = "not bit-identical across platforms; use the libm crate" },
    { path = "f64::log10", reason = "not bit-identical across platforms; use the libm crate" },
    { path = "f64::ln_1p", reason = "not bit-identical across platforms; use the libm crate" },
    { path = "f64::powf", reason = "not bit-identical across platforms; use the libm crate" },
    { path = "f64::powi", reason = "not bit-identical across platforms; use the libm crate" },
    { path = "f64::cbrt", reason = "not bit-identical across platforms; use the libm crate" },
