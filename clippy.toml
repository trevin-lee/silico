    { path = "f32::atan", reason = "not bit-identical across platforms; use the libm crate" },
    { path = "f32::atan2", reason = "not bit-identical across platforms; use the libm crate" },
    { path = "f32::sin_cos", reason = "not bit-identical across platforms; use the libm crate" },
