# A test that runs past 2 minutes is treated as hung and fails.
[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }

# The stress and oracle suites legitimately run for minutes.
[[profile.default.overrides]]
filter = 'test(/stress|oracle/)'
slow-timeout = { period = "60s", terminate-after = 10 }

# CI (NEXTEST_PROFILE=ci): every test runs, so one run reports every failure.
[profile.ci]
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 4 }

[[profile.ci.overrides]]
filter = 'test(/stress|oracle/)'
slow-timeout = { period = "60s", terminate-after = 10 }


# The document reader's timed tests (a deadline, to catch reading that grows faster than
# its input) run alone, every core theirs: on a loaded machine, other tests would take the
# time they measure. Its memory-heavy tests run one at a time.
[test-groups]
document-heavy = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(silico-core) & test(/promptly|long_shared_prefix|every_exponent_spelling/)'
threads-required = "num-cpus"

[[profile.default.overrides]]
filter = 'package(silico-core) & test(/size_or_memory_limits|opens_exactly_when|exactly_the_size|exponent_past_i128/)'
test-group = 'document-heavy'

[[profile.ci.overrides]]
filter = 'package(silico-core) & test(/promptly|long_shared_prefix|every_exponent_spelling/)'
threads-required = "num-cpus"

[[profile.ci.overrides]]
filter = 'package(silico-core) & test(/size_or_memory_limits|opens_exactly_when|exactly_the_size|exponent_past_i128/)'
test-group = 'document-heavy'
