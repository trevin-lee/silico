# A test that runs past 2 minutes is treated as hung and fails.
[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }

# The stress and oracle suites legitimately run for minutes.
[[profile.default.overrides]]
filter = 'test(/stress|oracle/)'
slow-timeout = { period = "60s", terminate-after = 10 }

# CI (NEXTEST_PROFILE=ci): every test runs, so one run reports every failure.
[profile.ci]
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 4 }

[[profile.ci.overrides]]
filter = 'test(/stress|oracle/)'
slow-timeout = { period = "60s", terminate-after = 10 }
