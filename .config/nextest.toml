# A test that runs past 2 minutes is treated as hung and fails.
[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }

# M5.12's scripted slice (silico-app's tests/slice.rs): the bracket built through the app on
# the real workers and lavapipe, its exports read back by FreeCAD: about 135 s unloaded, 225 s
# on CI's gate (2026-11-09). Before `stress|oracle`, which its name also matches: nextest takes
# each setting from the first override that matches. Named here: renaming it means renaming
# it here and in tests/mutants.sh.
[[profile.default.overrides]]
filter = 'package(silico-app) & test(=the_bracket_built_in_the_app_exports_a_printable_3mf_and_a_step_the_oracle_reads_back)'
slow-timeout = { period = "60s", terminate-after = 10 }

# silico-app's tests that draw every frame on lavapipe (the named two, and every test whose
# name says `lavapipe`; a new one is named so, and renaming one of the two means renaming it
# here): 3 to 24 s unloaded, but lavapipe draws on the CPU, and a loaded runner stretches
# them past 2 minutes with nothing hung (#563 measured the hover test at about 60 s under 80
# busy loops on its two CPUs). Each has five minutes: every wait in them is a minute at most
# (`RENDER_WAIT`, `FAKE_WAIT`, tests/common/ui.rs), there only for a hang, so a hang is said
# by the test, naming the wait, not killed by nextest with nothing said. (The slice matches
# none of these names: it keeps its ten minutes.)
[[profile.default.overrides]]
filter = 'package(silico-app) & test(/lavapipe|^the_port_draws_byte_for_byte_as_egui_kittests_renderer$|^the_reload_banner_lists_two_changes_over_the_viewport_with_their_marks$/)'
slow-timeout = { period = "60s", terminate-after = 5 }

# The stress and oracle suites legitimately run for minutes.
[[profile.default.overrides]]
filter = 'test(/stress|oracle/)'
slow-timeout = { period = "60s", terminate-after = 10 }

# CI (NEXTEST_PROFILE=ci): every test runs, so one run reports every failure. A test per
# CPU: a GitHub-hosted runner's 4 vCPUs are the gate's alone (gate.yml).
[profile.ci]
fail-fast = false
test-threads = "num-cpus"
# The default profile's timeouts and overrides hold here too: nextest takes them from it.

# CI's slowest tests first (each a minute or more on a hosted runner, 2026-11-24: the render
# worker's random close looks, 324 to 351 s; the app's slice, 256 s; the largest impossible
# sketch, 100 to 207 s; ten million triangles exported, 117 s; a sketch chain's hostile moves,
# 105 s; a million features validated, 69 s; the largest sphere and torus exported, 62 s), so
# none starts last and holds a gate's partition (gate.yml) minutes past the rest. Only their
# order: every other setting still comes from the overrides below. Renaming one of them means
# renaming it here.
[[profile.ci.overrides]]
filter = 'test(/adversarial_face_anchors::random_close/) | test(=the_bracket_built_in_the_app_exports_a_printable_3mf_and_a_step_the_oracle_reads_back) | test(=an_impossible_chain_of_the_largest_size_fails_as_solve_failed_not_a_timeout) | test(=export_command::ten_million_triangles_in_all_are_taken_and_the_first_solid_past_them_refused_naming_the_tolerance) | test(=chain::hostile::every_move_is_the_models_and_the_move_back_undoes_it) | test(=adversarial_validate::a_million_valid_features_validate_promptly) | test(=adversarial_export::the_largest_sphere_and_torus_at_the_finest_tolerance_are_exported_within_it)'
priority = 100

# The document reader's and the cache's timed tests (named `..._promptly`) measure their
# own thread's CPU time, so load doesn't fail them; they and the reader's memory-heavy tests
# (named here: renaming one means renaming it here) run one at a time, with room for a
# loaded machine's wall time. The cache's read of a file of exactly the largest entry
# (1 GiB, in silico-core's src/cache/mod.rs) is one of the `_promptly` tests on purpose, so it
# never runs beside the others: keep the name.
[test-groups]
document-heavy = { max-threads = 1 }
# The CLI's tests: each runs silico whole (its kernel workers, its cache, a save synced to
# disk), several times, so at most four run at once: on CI's runners, under eight jobs'
# load, many at once stalled together past nextest's timeout (2026-10-22, gate logs), with
# fsyncs there taking up to seconds.
cli = { max-threads = 4 }
thread-exhausting = { max-threads = 1 }
# The render worker's scale tests (named below: renaming one means renaming it here and in
# tests/mutants.sh): a 4,096-pixel render, or the most faces a scene may have, holds GiBs
# (docs/design/m4.6-render.md), so one at a time, each with every test thread, so nothing
# runs beside it. The render worker's other tests are small and run as any.
render = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(silico-core) & test(/_promptly$|size_or_memory_limits|opens_exactly_when|exactly_the_size|exponent_past_i128|loosely_spelled|exactly_when_it_takes_more|exactly_when_they_take_more/)'
test-group = 'document-heavy'
slow-timeout = { period = "60s", terminate-after = 10 }

# The 300 mm sphere and torus exported at 0.01 (silico-kernel adversarial_export): 22 s of
# meshing unloaded, each request held to 10 minutes of its own.
[[profile.default.overrides]]
filter = 'package(silico-kernel) & test(=adversarial_export::the_largest_sphere_and_torus_at_the_finest_tolerance_are_exported_within_it)'
slow-timeout = { period = "60s", terminate-after = 10 }

# An export of ten million triangles, the command's limit, and the solid past it (silico-core
# export_command): 44 s unloaded in a debug build, longer on a loaded machine.
[[profile.default.overrides]]
filter = 'package(silico-core) & test(=export_command::ten_million_triangles_in_all_are_taken_and_the_first_solid_past_them_refused_naming_the_tolerance)'
slow-timeout = { period = "60s", terminate-after = 10 }

# The render worker's random close looks at long slabs (silico-render
# adversarial_face_anchors): a thousand cases of two views each, every view drawn and every
# pixel cast against by hand, some three to six minutes unloaded in a debug build. On
# GitHub's hosted runners lavapipe's speed follows the CPU (2026-11-24): about 330 s on an
# Intel Xeon 6975P-C, 495 s on an AMD EPYC 9V45, and killed at 600 s on an AMD EPYC 7763 (an
# estimated 600 to 1,000 s there). So half an hour: this bounds the whole run only, and
# weakens nothing, since each draw keeps its own minute (WAIT, adversarial_face_anchors.rs).
[[profile.default.overrides]]
filter = 'package(silico-render) & test(/adversarial_face_anchors::random_close/)'
slow-timeout = { period = "60s", terminate-after = 30 }

# The fake kernel compared with the real one over 2,000 generated primitives: a minute
# alone, longer on a loaded machine.
[[profile.default.overrides]]
filter = 'package(silico-kernel) & test(the_fake_answers_as_the_real_kernel_does_at_the_edges)'
slow-timeout = { period = "60s", terminate-after = 10 }

# A pool of the most workers (silico-kernel adversarial_worker): bounded by its CPU time
# and, for a hang, by 9 minutes of its own; a loaded machine stretches its wall time.
[[profile.default.overrides]]
filter = 'package(silico-kernel) & test(=a_pool_of_the_most_workers_starts_and_stops_cleanly)'
slow-timeout = { period = "60s", terminate-after = 10 }

# Dropping a pool while a slot replaces its dead worker (silico-kernel adversarial_pool),
# swept over 120 moments: each attempt starts a pool and lists processes, so a loaded
# machine stretches its wall time (16 s alone, a minute at a load of 160). What it checks
# holds to no wall clock but a 30 s sleep it must not wait for.
[[profile.default.overrides]]
filter = 'package(silico-kernel) & test(=dropping_the_pool_while_a_slot_replaces_its_dead_worker_stops_at_once)'
slow-timeout = { period = "60s", terminate-after = 10 }

# A sketch no algorithm solves, at the most unknowns the worker takes (silico-sketch
# adversarial_document): every algorithm tried in turn, 74 s to 206 s by the machine's load
# (and 351 s in all, 337 s of the worker's CPU, on a hosted runner's Xeon Platinum 8370C),
# and given SKETCH_TIMEOUT and 300 s more (1,200 s), with 60 s more before the test says it
# hung, so it tests the answer, not the speed: killed only after that, at 22 minutes, which
# must stay above the test's own 1,260 s.
[[profile.default.overrides]]
filter = 'package(silico-sketch) & test(=an_impossible_chain_of_the_largest_size_fails_as_solve_failed_not_a_timeout)'
slow-timeout = { period = "60s", terminate-after = 22 }


# A pool whose slot's thread can't start (silico-kernel pool_slot_spawn_fails) takes away its
# own process's threads: on macOS, up to the process's cap. One at a time, so a run never
# holds two processes' worth at once. (A group holds within one nextest run, not between
# runs.)
[[profile.default.overrides]]
filter = 'package(silico-kernel) & binary(=pool_slot_spawn_fails)'
test-group = 'thread-exhausting'

# The CLI's tests share four threads (the `cli` group above), and each has five minutes: a
# test waits on silico, its runs and its server's replies, for 270 s in all (`BUDGET`,
# tests/common/run.rs), there only for a hang, past CI's runner's stalls of up to about
# 100 s, so a hang is said by the test rather than killed by nextest with nothing to say.
# (The bracket test whose name says `oracle` keeps the ten minutes of `stress|oracle`'s
# override above, which it matches first.)
[[profile.default.overrides]]
filter = 'package(silico-cli)'
test-group = 'cli'
slow-timeout = { period = "60s", terminate-after = 5 }

# The render client's tests (silico-render's `client` and `adversarial_client`) each start
# render workers on lavapipe, some a dozen in turn, and have five minutes: each wait in them
# is 60 s at most (`WAIT`, tests/common/client.rs), there only for a hang, so a hang is said
# by the test; the five minutes are for the whole test, which CI's runner's stalls of up to
# about 100 s (#532) pushed past nextest's 2 minutes with nothing hung (#564).
[[profile.default.overrides]]
filter = 'package(silico-render) & test(/^(client|adversarial_client)::/)'
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.default.overrides]]
filter = 'package(silico-render) & test(/the_most_edges_a_scene_may_have|the_most_faces_a_scene_may_have|a_part_of_ctc_size_at_4096_square|three_thousand_bodies_draw|ten_thousand_highlighted_faces|the_largest_render_is_the_box_from_the_front/)'
test-group = 'render'
threads-required = 'num-test-threads'
# Each draw is bounded by the tests' own WAIT (a minute), and the 4096 part draws twice (once
# timed, once with its IDs), so a slow second draw says so at its WAIT before nextest's kill.
slow-timeout = { period = "60s", terminate-after = 5 }
