# A test that runs past 2 minutes is treated as hung and fails.
[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }

# The stress and oracle suites legitimately run for minutes.
[[profile.default.overrides]]
filter = 'test(/stress|oracle/)'
slow-timeout = { period = "60s", terminate-after = 10 }

# CI (NEXTEST_PROFILE=ci): every test runs, so one run reports every failure. One test per
# physical core: the runner VM's 30 vCPUs are 15 cores' SMT siblings, and 30 tests at once
# run each thread slower.
[profile.ci]
fail-fast = false
test-threads = 15
slow-timeout = { period = "30s", terminate-after = 4 }

[[profile.ci.overrides]]
filter = 'test(/stress|oracle/)'
slow-timeout = { period = "60s", terminate-after = 10 }


# The document reader's timed tests (named `..._promptly`) measure their own thread's CPU
# time, so load doesn't fail them; they and its memory-heavy tests (named here: renaming
# one means renaming it here) run one at a time, with room for a loaded machine's wall
# time.
[test-groups]
document-heavy = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(silico-core) & test(/_promptly$|size_or_memory_limits|opens_exactly_when|exactly_the_size|exponent_past_i128|loosely_spelled|exactly_when_it_takes_more|exactly_when_they_take_more/)'
test-group = 'document-heavy'
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.ci.overrides]]
filter = 'package(silico-core) & test(/_promptly$|size_or_memory_limits|opens_exactly_when|exactly_the_size|exponent_past_i128|loosely_spelled|exactly_when_it_takes_more|exactly_when_they_take_more/)'
test-group = 'document-heavy'
slow-timeout = { period = "60s", terminate-after = 10 }

# The fake kernel compared with the real one over 2,000 generated primitives: a minute
# alone, longer on a loaded machine.
[[profile.default.overrides]]
filter = 'package(silico-kernel) & test(the_fake_answers_as_the_real_kernel_does_at_the_edges)'
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.ci.overrides]]
filter = 'package(silico-kernel) & test(the_fake_answers_as_the_real_kernel_does_at_the_edges)'
slow-timeout = { period = "60s", terminate-after = 10 }

# A pool of the most workers (silico-kernel adversarial_worker): bounded by its CPU time
# and, for a hang, by 9 minutes of its own; a loaded machine stretches its wall time.
[[profile.default.overrides]]
filter = 'package(silico-kernel) & test(=a_pool_of_the_most_workers_starts_and_stops_cleanly)'
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.ci.overrides]]
filter = 'package(silico-kernel) & test(=a_pool_of_the_most_workers_starts_and_stops_cleanly)'
slow-timeout = { period = "60s", terminate-after = 10 }

# Dropping a pool while a slot replaces its dead worker (silico-kernel adversarial_pool),
# swept over 120 moments: each attempt starts a pool and lists processes, so a loaded
# machine stretches its wall time (16 s alone, a minute at a load of 160). What it checks
# holds to no wall clock but a 30 s sleep it must not wait for.
[[profile.default.overrides]]
filter = 'package(silico-kernel) & test(=dropping_the_pool_while_a_slot_replaces_its_dead_worker_stops_at_once)'
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.ci.overrides]]
filter = 'package(silico-kernel) & test(=dropping_the_pool_while_a_slot_replaces_its_dead_worker_stops_at_once)'
slow-timeout = { period = "60s", terminate-after = 10 }

# A sketch no algorithm solves, at the most unknowns the worker takes (silico-sketch
# adversarial_document): every algorithm tried in turn, about 74 s on a loaded machine.
[[profile.default.overrides]]
filter = 'package(silico-sketch) & test(=an_impossible_chain_of_the_largest_size_fails_as_solve_failed_not_a_timeout)'
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.ci.overrides]]
filter = 'package(silico-sketch) & test(=an_impossible_chain_of_the_largest_size_fails_as_solve_failed_not_a_timeout)'
slow-timeout = { period = "60s", terminate-after = 10 }
