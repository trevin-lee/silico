[package]
name = "silico-font"
description = "The app's fonts, Inter and JetBrains Mono (docs/design/m5.0-app.md, decision 11), under their own licence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The Rust is Silico's; the fonts are Inter's and JetBrains Mono's, each under the SIL Open
# Font License 1.1 (OFL.txt, JetBrainsMono-OFL.txt), which deny.toml allows for this crate
# alone (M5 decision 13b).
license = "GPL-3.0-or-later AND OFL-1.1"
publish.workspace = true

