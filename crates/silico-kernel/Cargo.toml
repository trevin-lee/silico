[package]
name = "silico-kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Operations that exist only to test the bridge. This crate's own tests turn it on
# (the dev-dependency on itself below); nothing else should.
test_ops = ["silico-worker/test_ops"]

[dependencies]
crc32fast.workspace = true
cxx.workspace = true
libc.workspace = true
silico-protocol.workspace = true
silico-worker.workspace = true
tracing.workspace = true

[[bin]]
name = "silico-kernel-worker"
path = "src/bin/silico-kernel-worker.rs"

[[bin]]
name = "silico-brep-convert"
path = "src/bin/silico-brep-convert.rs"

[[bin]]
name = "silico-kernel-test-worker"
path = "src/bin/silico-kernel-test-worker.rs"
required-features = ["test_ops"]

[[bench]]
name = "ipc"
harness = false

[[bench]]
name = "pool"
harness = false

[dev-dependencies]
command-fds.workspace = true
proptest.workspace = true
rustix = { workspace = true, features = ["process"] }
serde_json.workspace = true
silico-protocol.workspace = true
silico-core = { workspace = true, features = ["fake"] }
silico-kernel = { path = ".", features = ["test_ops"] }
silico-oracle.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
cxx-build.workspace = true

[lints]
workspace = true
