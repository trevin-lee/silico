[package]
name = "silico-sketch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# The tests are built as a few programs, not one per file (each listed below): a new test
# file must be added as a module of one (tests/all_*.rs) or as one here, or it never runs
# (tests/all_solve.rs's every_test_file_is_built says which aren't).
autotests = false

[features]
# Operations that exist only to test the bridge and the worker. This crate's own tests turn
# it on (the dev-dependency on itself below); nothing else should.
test_ops = ["silico-worker/test_ops"]

[dependencies]
cxx.workspace = true
silico-protocol.workspace = true
silico-worker.workspace = true

[[bin]]
name = "silico-sketch-worker"
path = "src/bin/silico-sketch-worker.rs"

[[bin]]
name = "silico-sketch-test-worker"
path = "src/bin/silico-sketch-test-worker.rs"
required-features = ["test_ops"]

[[bench]]
name = "drag"
harness = false

[dev-dependencies]
cpu-time.workspace = true
libm.workspace = true
proptest.workspace = true
serde_json.workspace = true
sha2.workspace = true
# The sketch edits' tests (tests/session_sketch_edits.rs): sessions on the fake kernel, their
# sketches solved by this crate's worker.
silico-core = { workspace = true, features = ["fake"] }
silico-sketch = { path = ".", features = ["test_ops"] }
tempfile.workspace = true

[build-dependencies]
cxx-build.workspace = true

[lints]
workspace = true

# A few test programs, each a group of test files as modules; two stay programs of their
# own: adversarial_document holds a test .config/nextest.toml and tests/mutants.sh name
# exactly, and stress's module name would put every test of it under nextest's stress
# override.

[[test]]
name = "all_solve"
path = "tests/all_solve.rs"

[[test]]
name = "all_document"
path = "tests/all_document.rs"

[[test]]
name = "adversarial_document"
path = "tests/adversarial_document.rs"

[[test]]
name = "stress"
path = "tests/stress.rs"
