# Fuzzing for silico-protocol's decoder. Its own workspace, built with nightly by
# cargo-fuzz: cargo +nightly fuzz run decode -- -max_total_time=300
[package]
name = "silico-protocol-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
silico-protocol = { path = ".." }

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
