[package]
name = "silico-app"
description = "Silico's app: a window over the core's commands (docs/design/m5.0-app.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "silico-app"
path = "src/main.rs"

[dependencies]
silico-core.workspace = true
silico-protocol.workspace = true
libm.workspace = true
silico-font.workspace = true
eframe.workspace = true
egui_tiles.workspace = true
# The icons, drawn from SVG (`icons`).
egui_extras.workspace = true
# The backends eframe's renderer draws with (Metal, Vulkan), as the workspace chooses them.
wgpu.workspace = true
# The viewport's renderer (re_renderer's, one with agents' renders: M4.6's R1), drawn on
# eframe's device.
silico-render.workspace = true
# Native file dialogs, on their async API (`browse`).
rfd.workspace = true
# Where the list of recent documents is kept: the platform's app-data folder (`recent`).
directories.workspace = true
tracing.workspace = true

[dev-dependencies]
# Its wgpu renderer: a test draws the viewport through silico-render on lavapipe.
egui_kittest = { workspace = true, features = ["wgpu"] }
# The bench's box mesh, drawn by that test.
silico-render = { workspace = true, features = ["bench"] }
silico-core = { workspace = true, features = ["fake"] }
tempfile.workspace = true

[lints]
workspace = true
