[package]
name = "silico-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "silico"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true
silico-core.workspace = true
silico-mcp.workspace = true
signal-hook.workspace = true
tracing.workspace = true

[dev-dependencies]
# The bracket (tests/bracket.rs): its replies validated against their tools' output
# schemas, read as written (raw_value), its mesh worked out by hand (libm), and its 3MF
# read back by FreeCAD, the oracle.
jsonschema.workspace = true
libc.workspace = true
libm.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
silico-oracle.workspace = true
tempfile.workspace = true

[lints]
workspace = true
