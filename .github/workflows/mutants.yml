# Mutation testing (cargo-mutants, tests/mutants.sh) sharded over the self-hosted runners,
# on request: round 1 of a review's tests lens (.claude/skills/review-tests). Each shard
# runs its share of the mutants in its runner's gate worktree, which keeps the gate's
# build; the summary gathers every shard's caught, missed, timed-out, and unviable mutants
# into the run's summary and one artifact, and fails if any mutant was missed.
#
#   gh workflow run mutants.yml --ref <branch> -f base=main -f packages="silico-core"
name: mutants

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to test (empty: the branch this runs on)"
        default: ""
      base:
        description: "Only mutants in lines changed since this branch or commit (git diff base...ref; empty: every mutant)"
        default: ""
      packages:
        description: "Only mutants in these packages, space-separated (empty: every package)"
        default: ""
      shards:
        description: "Number of runners to share the work (1 to 16)"
        default: "8"

permissions:
  contents: read

jobs:
  plan:
    runs-on: [self-hosted, linux, x64, pve]
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - id: plan
        env:
          SHARDS: ${{ inputs.shards }}
          PACKAGES: ${{ inputs.packages }}
        run: |
          case $SHARDS in
          [1-9] | 1[0-6]) ;;
          *) echo "::error::shards must be 1 to 16, not '$SHARDS'"; exit 1 ;;
          esac
          for package in $PACKAGES; do
            case $package in
            *[!a-z0-9_-]*) echo "::error::not a package name: '$package'"; exit 1 ;;
            esac
          done
          echo "shards=[$(seq -s, 0 $((SHARDS - 1)))]" >>"$GITHUB_OUTPUT"

  shard:
    needs: plan
    runs-on: [self-hosted, linux, x64, pve]
    # A whole-workspace run is about 2,300 mutants: hours, even sharded.
    timeout-minutes: 1440
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Toolchains
        run: bash .github/tools.sh
      - name: Mutants
        env:
          BASE: ${{ inputs.base }}
          PACKAGES: ${{ inputs.packages }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ inputs.shards }}
        run: |
          args=(--shard "$SHARD/$SHARDS" --sharding round-robin --output "$RUNNER_TEMP/out")
          if [ -n "$BASE" ]; then
            base=$(git rev-parse --verify --quiet "origin/$BASE^{commit}" || git rev-parse --verify "$BASE^{commit}")
            git diff "$base...HEAD" >"$RUNNER_TEMP/change.diff"
            echo "Mutants in $(git diff --name-only "$base...HEAD" | wc -l) changed files since $base"
            args+=(--in-diff "$RUNNER_TEMP/change.diff")
          fi
          for package in $PACKAGES; do args+=(-p "$package"); done
          # Share the machine with the other shards (and any gate), so timing tests don't
          # fail under load.
          share=$(( $(nproc) / 8 > 2 ? $(nproc) / 8 : 2 ))
          export CARGO_BUILD_JOBS=$share NEXTEST_TEST_THREADS=$share
          args+=(--jobserver-tasks "$share")
          # 2: mutants missed; 3: mutants timed out. The summary reports both.
          status=0
          pixi run mutants -- "${args[@]}" || status=$?
          case $status in 0 | 2 | 3) ;; *) exit "$status" ;; esac
          # A shard with no mutants writes nothing; it still reports.
          mkdir -p "$RUNNER_TEMP/out/mutants.out"
          echo "$SHARD" >"$RUNNER_TEMP/out/mutants.out/shard"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/out/mutants.out
          if-no-files-found: error

  summary:
    needs: [plan, shard]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: [self-hosted, linux, x64, pve]
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mutants-shard-*
          path: shards
      - name: Summary
        env:
          SHARDS: ${{ inputs.shards }}
          SHARD_RESULT: ${{ needs.shard.result }}
          REF: ${{ inputs.ref || github.ref_name }}
          BASE: ${{ inputs.base }}
          PACKAGES: ${{ inputs.packages }}
        run: |
          mkdir -p all
          for outcome in caught missed timeout unviable; do
            cat shards/*/"$outcome.txt" 2>/dev/null | sort >"all/$outcome.txt" || true
          done
          count() { grep -c . "all/$1.txt" || true; }
          reported=$(find shards -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l)
          {
            echo "## Mutants: $REF${BASE:+ since $BASE}${PACKAGES:+ ($PACKAGES)}"
            echo
            echo "| Caught | Missed | Timed out | Unviable | Shards reported |"
            echo "|---|---|---|---|---|"
            echo "| $(count caught) | $(count missed) | $(count timeout) | $(count unviable) | $reported of $SHARDS |"
            for outcome in missed timeout; do
              if [ -s "all/$outcome.txt" ]; then
                echo
                echo "### ${outcome^}"
                echo '```'
                cat "all/$outcome.txt"
                echo '```'
              fi
            done
          } >>"$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          if [ "$SHARD_RESULT" != success ] || [ "$reported" -ne "$SHARDS" ]; then
            echo "::error::a shard failed or didn't report: the results are incomplete"
            exit 1
          fi
          if [ -s all/missed.txt ]; then
            echo "::error::$(count missed) mutants missed"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: mutants
          path: all
