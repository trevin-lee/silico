# Mutation testing (cargo-mutants, tests/mutants.sh) sharded over GitHub's hosted runners
# (ubuntu-24.04, 4 vCPUs each, free for a public repository), on request: round 1 of a review's
# tests lens (.claude/skills/review-tests). Each shard runs its share of the mutants in the
# gate's worktree on a runner of its own (.github/actions/prepare restores its pixi
# environments, OCCT, and its dependencies' build from the cache); the summary gathers every
# shard's caught, missed, timed-out, and unviable mutants into the run's summary, and fails if
# any mutant was missed, or if a shard tested fewer mutants than it planned (INCOMPLETE), so a
# run whose shard's baseline failed never reads as clean. A run that finds nothing to mutate
# (a change to data only) passes, saying so, unless a file given isn't in the tree or a regex
# given matched nothing (.github/mutants-none.sh). Each shard keeps its outcomes as an
# artifact (mutants-shard-<n>: the outcome lists and the logs worth reading,
# .github/mutants-keep.sh), which the summary reads, and every per-mutant log as another
# (mutants-logs-shard-<n>); a public repository's artifacts cost nothing to store.
#
#   gh workflow run mutants.yml --ref main -f ref=<branch> -f base=main -f packages="silico-core"
#   gh workflow run mutants.yml --ref main -f files="crates/silico-core/src/cache/*.rs crates/silico-core/src/naming/*.rs"
#   gh workflow run mutants.yml --ref main -f ref=<branch> -f re='profile\.rs:.* in (meeting|on_arc)$'
#     (re-checks survivors: only the mutants whose names match, in minutes)
#
# GitHub runs at most 20 of the account's jobs at once. A run's shards take at most 12 of them
# (max-parallel, below), a run that gates a merge at most 6, so gates always find room beside a
# long run, or beside two runs that gate merges.
name: mutants
# The ref, base, packages, files, and regex, so concurrent runs can be told apart
# (review-tests finds its run by this title). A filler run's starts "filler a" or "filler
# b<k>".
run-name: "${{ inputs.filler && format('filler {0} ', inputs.filler) || '' }}mutants ${{ inputs.ref || github.ref_name }} since ${{ inputs.base || 'nothing' }} in ${{ inputs.packages || 'every package' }}${{ inputs.files && format(' files {0}', inputs.files) || '' }}${{ inputs.re && format(' matching {0}', inputs.re) || '' }}${{ inputs.tests && format(' tested by {0}', inputs.tests) || '' }}${{ inputs.long && ' (long)' || '' }}"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to test (empty: the branch this runs on)"
        default: ""
      base:
        description: "Only mutants in lines changed since this branch or commit (git diff base...ref; empty: every mutant)"
        default: ""
      packages:
        description: "Only mutants in these packages, space-separated (empty: every package)"
        default: ""
      files:
        description: "Only mutants in these source files, space-separated, each a --file: a path from the repository's root, with * (not crossing /) or ** for globs; a word without / matches that name anywhere (empty: every file)"
        default: ""
      re:
        description: "Only mutants whose names match this regex, cargo-mutants' --re, searched in each name (path:line:col: what was replaced, often ending ' in fn'); match a survivor by its description rather than its line, which moves; escape regex characters; no single quotes (write . for one) or newlines (empty: every mutant)"
        default: ""
      tests:
        description: "Only these packages' tests for each mutant, space-separated, each a --test-package; workspace for every workspace test. Empty: every workspace test for a filler run; for any other, the plan's choice (.github/mutants-tests.py), the mutated packages and every package that depends on them, the only tests that can see a mutant through Cargo; or every workspace test when a mutant is in code linked into the worker binaries, which other packages' tests run from disk. Naming packages is sound only where the mutated code is in them or the libraries they build: a worker binary another package builds isn't rebuilt for their tests, so its mutants would read as missed"
        default: ""
      shards:
        description: "The fewest shards to share the work (1 to 32; up to six run at once, twelve for a long run). The plan adds shards, up to 32, so none holds more than 40 mutants, about 4.5 hours on a hosted runner; a filler run has exactly these"
        default: "1"
      long:
        description: "Empty (the default) for a run that gates a merge: at most six shards, six at once. Set (true) for a long one, a milestone's or a whole crate's, hours long: up to 32 shards, twelve at once. A run without it whose plan needs more than six shards is refused at the plan, saying so"
        default: ""
      filler:
        description: "Empty for a real run. Set (a, or b and a number, as the CI VM's filler named its runs) for a background sample: it stops after an hour, has exactly the shards asked for, tests its mutants in random order, and fails only on misses not in .github/mutants-triaged.txt"
        default: ""

# Read only. Only write-access users start this workflow, on refs they choose, and each job
# runs on a fresh machine of its own.
permissions:
  contents: read

env:
  # As the gate builds (gate.yml): every mutant rebuilds from a fresh checkout's files, so
  # incremental compilation's caches would only be written.
  CARGO_INCREMENTAL: "0"

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
      tests: ${{ steps.plan.outputs.tests }}
      tests_why: ${{ steps.plan.outputs.tests_why }}
    steps:
      # Every commit, to list the ref's mutants as its shards will find them.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Toolchains
        run: bash .github/tools.sh
      - id: plan
        env:
          REF: ${{ inputs.ref }}
          BASE: ${{ inputs.base }}
          SHARDS: ${{ inputs.shards }}
          PACKAGES: ${{ inputs.packages }}
          FILES: ${{ inputs.files }}
          RE: ${{ inputs.re }}
          FILLER: ${{ inputs.filler }}
          LONG: ${{ inputs.long }}
          TESTS: ${{ inputs.tests }}
        run: |
          case $SHARDS in
          [1-9] | [12][0-9] | 3[0-2]) ;;
          *) echo "::error::shards must be 1 to 32, not '$SHARDS'"; exit 1 ;;
          esac
          for package in $PACKAGES $TESTS; do
            case $package in
            *[!a-z0-9_-]*) echo "::error::not a package name: '$package'"; exit 1 ;;
            esac
          done
          # `workspace`: every workspace test, said outright rather than left to the plan.
          if [ "$TESTS" = workspace ]; then
            TESTS=""
            tests_why="every workspace test, as asked"
          elif [ -n "$TESTS" ]; then
            tests_why="as asked"
          fi
          # Globs are cargo-mutants' to match, not the shell's.
          set -f
          for file in $FILES; do
            case $file in
            /* | -* | *..* | *[!A-Za-z0-9_./*-]*) echo "::error::not a path from the repository's root: '$file'"; exit 1 ;;
            esac
          done
          # pixi re-parses a task's arguments in its own shell, inside single quotes it doesn't
          # escape: a quote in the regex would end the quoting, so it's refused (`.` matches
          # it), as is a newline.
          case $RE in
          *"'"* | *$'\n'*) echo "::error::the regex has a single quote or a newline: write . for a quote"; exit 1 ;;
          esac
          if ! [[ $FILLER =~ ^(a|b[0-9]+)?$ ]]; then
            echo "::error::filler must be empty, a, or b and a number, not '$FILLER'"
            exit 1
          fi
          # The workflow asks only whether it's set: so only true sets it.
          case $LONG in
          "" | true) ;;
          *) echo "::error::long must be empty or true, not '$LONG'"; exit 1 ;;
          esac
          # Enough shards that none runs past about 4.5 hours, three quarters of a hosted job's
          # 6 (the shard's timeout-minutes, below), the rest for its setup and baseline: 40
          # mutants each, at up to about 400 seconds a mutant on a hosted runner's 4 vCPUs (per,
          # below; the CI VM's shards took up to 540 at 2 threads, loaded). Counted as the
          # shards will list them, in a tree of the ref; past 32 shards' worth (1,280 mutants),
          # a shard holds more. A filler run is cut off after an hour whatever it holds, so has
          # the shards it asks for.
          shards=$SHARDS
          if [ -z "$FILLER" ]; then
            resolve() { git rev-parse --verify --quiet "origin/$1^{commit}" || git rev-parse --verify "$1^{commit}"; }
            commit=$(resolve "${REF:-HEAD}")
            # Extracted, not a worktree: one left registered by a plan that stopped would fail
            # every later plan on this runner. The runner empties RUNNER_TEMP after each job.
            tree=$RUNNER_TEMP/tree
            mkdir "$tree"
            git archive -o "$RUNNER_TEMP/tree.tar" "$commit"
            tar -xf "$RUNNER_TEMP/tree.tar" -C "$tree"
            # Each package `tests` names is one of the tree's, so a misspelt one fails here, not
            # at each shard's baseline after its setup.
            cargo metadata --no-deps --format-version 1 --manifest-path "$tree/Cargo.toml" >"$RUNNER_TEMP/metadata.json"
            members=$(jq -r '.packages[].name' "$RUNNER_TEMP/metadata.json")
            for package in $TESTS; do
              grep -qxF "$package" <<<"$members" || { echo "::error::tests names no package of the tree: '$package'"; exit 1; }
            done
            args=(--list --dir "$tree")
            if [ -n "$BASE" ]; then
              # On its own line, so a base that doesn't resolve stops the plan.
              base=$(resolve "$BASE")
              git diff "$base...$commit" >"$RUNNER_TEMP/change.diff"
              args+=(--in-diff "$RUNNER_TEMP/change.diff")
            fi
            for package in $PACKAGES; do args+=(-p "$package"); done
            for file in $FILES; do args+=(--file "$file"); done
            if [ -n "$RE" ]; then args+=("--re=$RE"); fi
            cargo mutants "${args[@]}" >"$RUNNER_TEMP/mutants.txt"
            mutants=$(grep -c . "$RUNNER_TEMP/mutants.txt" || true)
            per=40
            needed=$(( (mutants + per - 1) / per ))
            shards=$(( needed > shards ? needed : shards ))
            shards=$(( shards > 32 ? 32 : shards ))
            echo "$mutants mutants: $shards shards ($SHARDS asked for)" | tee -a "$GITHUB_STEP_SUMMARY"
            # Empty: the mutated packages and those that depend on them, unless a mutant is
            # linked into the worker binaries (#445: a silico-mcp mutant only silico-mcp's
            # tests catch took 26 to 30 minutes of the 30 a mutant then got, waiting for the whole
            # workspace's tests to reach them).
            if [ -z "$TESTS" ] && [ -z "${tests_why:-}" ]; then
              # A fault here leaves every workspace test, slower but sound.
              chosen=$(python3 -I .github/mutants-tests.py "$RUNNER_TEMP/metadata.json" "$RUNNER_TEMP/mutants.txt") ||
                chosen=$'\nevery workspace test: .github/mutants-tests.py failed'
              TESTS=${chosen%%$'\n'*}
              tests_why=${chosen#*$'\n'}
            fi
            echo "Tests: ${TESTS:-every workspace test} ($tests_why)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # A run that gates a merge holds at most six of the account's 20 hosted jobs at once
          # (the shard's max-parallel), so two such runs leave gates eight; one that needs more
          # shards would hold its six for many hours, and every gate and merge-lane run beside
          # it would wait. It's refused here, in a minute, and dispatched as a long run instead,
          # which says it means to hold up to twelve. Counted by what it needs, not the shards
          # asked for.
          if [ -z "$FILLER" ] && [ -z "$LONG" ] && [ "${needed:-0}" -gt 6 ]; then
            echo "::error::$mutants mutants need $needed shards, more than a run that gates a merge may hold (6): dispatch it with long=true, or narrow it (base, files, re, tests)"
            exit 1
          fi
          if [ -z "$FILLER" ] && [ -z "$LONG" ] && [ "$SHARDS" -gt 6 ]; then
            echo "::error::$SHARDS shards asked for, more than a run that gates a merge may hold (6): dispatch it with long=true, or ask for fewer"
            exit 1
          fi
          echo "count=$shards" >>"$GITHUB_OUTPUT"
          echo "shards=[$(seq -s, 0 $((shards - 1)))]" >>"$GITHUB_OUTPUT"
          echo "tests=$TESTS" >>"$GITHUB_OUTPUT"
          echo "tests_why=${tests_why:-}" >>"$GITHUB_OUTPUT"

  shard:
    needs: plan
    runs-on: ubuntu-24.04
    # The plan gives a shard about 4.5 hours of mutants, under GitHub's 6 hours a job, but no
    # more than 32 shards: a run past 1,280 mutants holds more, and a whole-workspace run
    # (11,547 mutants on 2026-10-29, silico-core 8,557) is cut off here even at 32, so narrow
    # it by package, file, or base. A filler run stops after an hour.
    timeout-minutes: ${{ inputs.filler != '' && 60 || 350 }}
    strategy:
      fail-fast: false
      # At most twelve shards at once for a long run, six for any other (which the plan holds
      # to six shards): GitHub runs at most 20 of the account's jobs at once, and gates need
      # room beside a long run, or beside two runs that gate merges (eight jobs either way).
      max-parallel: ${{ inputs.long != '' && 12 || 6 }}
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      # Without debug info (Trevin, 2026-10-22): every mutant rebuilds and relinks the
      # workspace's test binaries, and DWARF is much of what they write. Gates keep it, and so
      # does a run off CI. A mutant's backtrace loses file:line, which nobody reads; its
      # failing test's name and message are what triage uses. It builds in its own target
      # directory in the gate's tree (target-mutants/, tests/committed-tree.sh), bound at about
      # 1.5 times one debug-free build (4.2 GiB, measured 2026-10-22). At the job's level, so
      # the dependencies' cache is keyed by it (.github/actions/prepare).
      CARGO_PROFILE_DEV_DEBUG: "0"
      SILICO_TARGET: target-mutants
      SILICO_TARGET_LIMIT_GIB: "6"
    steps:
      # Every commit, to find the ref and the base.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      # Branch names as they are on GitHub, and commits, abbreviated or not. This checkout's
      # scripts test the ref's tree, so refs older than them work too.
      - name: The ref
        id: ref
        env:
          REF: ${{ inputs.ref }}
        run: |
          resolve() { git rev-parse --verify --quiet "origin/$1^{commit}" || git rev-parse --verify "$1^{commit}"; }
          commit=$(resolve "${REF:-HEAD}")
          echo "commit=$commit" >>"$GITHUB_OUTPUT"
      # The dependencies' build saved by one shard of a run dispatched on main (any ref
      # tested), so runs that gate merges restore it and no two shards race to save it.
      - uses: ./.github/actions/prepare
        with:
          commit: ${{ steps.ref.outputs.commit }}
          target: target-mutants
          rust-key: mutants
          save: ${{ github.ref == 'refs/heads/main' && inputs.filler == '' && matrix.shard == 0 }}
      - name: Test scratch
        run: bash .github/scratch.sh start
      - name: Mutants
        env:
          REF: ${{ inputs.ref }}
          BASE: ${{ inputs.base }}
          PACKAGES: ${{ inputs.packages }}
          FILES: ${{ inputs.files }}
          RE: ${{ inputs.re }}
          TESTS: ${{ needs.plan.outputs.tests }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.plan.outputs.count }}
          FILLER: ${{ inputs.filler }}
          SILICO_TREE_COMMIT: ${{ steps.ref.outputs.commit }}
        run: |
          resolve() { git rev-parse --verify --quiet "origin/$1^{commit}" || git rev-parse --verify "$1^{commit}"; }
          echo "Testing $(git log -1 --format='%h %s' "$SILICO_TREE_COMMIT")"
          args=(--shard "$SHARD/$SHARDS" --sharding round-robin --output "$RUNNER_TEMP/out")
          if [ -n "$BASE" ]; then
            base=$(resolve "$BASE")
            git diff "$base...$SILICO_TREE_COMMIT" >"$RUNNER_TEMP/change.diff"
            echo "Mutants in $(git diff --name-only "$base...$SILICO_TREE_COMMIT" | wc -l) changed files since $base"
            args+=(--in-diff "$RUNNER_TEMP/change.diff")
          fi
          for package in $PACKAGES; do args+=(-p "$package"); done
          # Paths from the tree's root, which cargo-mutants matches in the gate's worktree.
          set -f
          for file in $FILES; do args+=(--file "$file"); done
          set +f
          # One regex, as given: cargo-mutants matches it against each mutant's name.
          # (`--re=` so a regex beginning with `-` isn't read as an option.)
          if [ -n "$RE" ]; then args+=("--re=$RE"); fi
          for package in $TESTS; do args+=(--test-package "$package"); done
          # A filler run is cut off after an hour: in random order (cargo-mutants shuffles each
          # shard's share after sharding), so each turn at a slice reaches different mutants.
          if [ -n "$FILLER" ]; then args+=(--shuffle); fi
          # Every CPU: the runner is this shard's alone. Retry a failed test, since one that
          # fails only under load would fail the baseline or count a mutant as caught; a mutant
          # that breaks a test fails it every time.
          share=$(nproc)
          chosen="$share threads, the runner's every CPU"
          echo "Shard $SHARD: $chosen" | tee -a "$GITHUB_STEP_SUMMARY"
          export CARGO_BUILD_JOBS=$share NEXTEST_TEST_THREADS=$share NEXTEST_RETRIES=2
          # One seed for every property run through `proptest!` (it overrides the seeds tests
          # fix in their configs; only a TestRunner made directly keeps its own), so each mutant
          # meets the same cases as the baseline. With random seeds, a property that failed now
          # and then killed mutants it had nothing to do with: M3.5's first run counted 82 so.
          # Now a bug the seed meets fails the baseline and stops the run, and one it doesn't
          # meet fails no mutant either. Saved failures stay on: the committed
          # .proptest-regressions files are replayed for each mutant, and a case saved during
          # the run comes from the seed's own cases. The seed, PROPTEST_RNG_SEED=20261021, is
          # pixi.toml's mutants task's, the gate's too (its test task's), and a task's env wins
          # over a caller's, so it isn't set here. New seeds are explored apart
          # (proptest-explore.yml).
          args+=(--jobserver-tasks "$share")
          # 2: mutants missed; 3: mutants timed out. The summary reports both.
          status=0
          pixi run mutants -- "${args[@]}" || status=$?
          # A shard with no mutants to test writes an empty list, or none at all (below); it
          # still reports. (After the run, which moves a mutants.out it finds aside.)
          mkdir -p "$RUNNER_TEMP/out/mutants.out"
          echo "$chosen" >"$RUNNER_TEMP/out/mutants.out/threads"
          case $status in 0 | 2 | 3) ;; *) exit "$status" ;; esac
          echo "$SHARD" >"$RUNNER_TEMP/out/mutants.out/shard"
          # A shard with no mutants to test (no list, or an empty one) says so, with each file
          # given that matches nothing in the tree (.github/mutants-none.sh). If that fails,
          # the summary reads a shard with no list as stopped before it listed its mutants
          # (incomplete), and one with an empty list as unchecked, so files given fail it.
          if [ "$status" -eq 0 ]; then
            set -f
            # shellcheck disable=SC2086 # FILES is a list of globs, split but not expanded
            bash .github/mutants-none.sh "$RUNNER_TEMP/out/mutants.out" "$SILICO_TREE_COMMIT" $FILES ||
              echo "::warning::.github/mutants-none.sh failed: a shard that found no mutants reads as incomplete"
            set +f
          fi
      # Even when the run is cancelled or times out: cargo-mutants writes each outcome as it
      # goes, so a stopped shard's harvest is kept (and the summary says it's incomplete): the
      # outcome lists, and the logs of the baseline and of each mutant missed or timed out
      # (.github/mutants-keep.sh), as the artifact the summary reads.
      - name: Keep the shard's outcomes
        if: ${{ always() }}
        env:
          SHARD: ${{ matrix.shard }}
        run: bash .github/mutants-keep.sh "$RUNNER_TEMP/out/mutants.out" "$RUNNER_TEMP/kept/mutants-shard-$SHARD"
      # The summary reads a shard that uploaded nothing as incomplete, so a failed upload fails
      # the run there, saying which shard, not here.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/kept/mutants-shard-${{ matrix.shard }}
          if-no-files-found: ignore
          retention-days: 14
      # Every per-mutant log, for a look in GitHub's UI.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: mutants-logs-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/out/mutants.out
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove the test scratch
        if: ${{ always() }}
        run: bash .github/scratch.sh end

  summary:
    needs: [plan, shard]
    # Even when the run is cancelled, to gather what the shards finished.
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Only the triaged list, from the branch this runs on.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: .github/mutants-triaged.txt
          sparse-checkout-cone-mode: false
      # Each shard's outcomes, as its keep step left them. A download that fails, or takes
      # past its minutes, leaves the shards it didn't fetch reading as incomplete, below.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        timeout-minutes: 5
        with:
          pattern: mutants-shard-*
          path: ${{ runner.temp }}/results
      - name: Summary
        env:
          SHARDS: ${{ needs.plan.outputs.count }}
          SHARD_RESULT: ${{ needs.shard.result }}
          REF: ${{ inputs.ref || github.ref_name }}
          BASE: ${{ inputs.base }}
          PACKAGES: ${{ inputs.packages }}
          FILES: ${{ inputs.files }}
          RE: ${{ inputs.re }}
          TESTS: ${{ needs.plan.outputs.tests }}
          TESTS_WHY: ${{ needs.plan.outputs.tests_why }}
          FILLER: ${{ inputs.filler }}
          RESULTS: ${{ runner.temp }}/results
        run: |
          # Each shard's outcomes, from its artifact (RESULTS/mutants-shard-<n>/): whole once
          # its keep step finished (its `kept` marker), and whatever it reached if not.
          mkdir -p shards
          for ((n = 0; n < SHARDS; n++)); do
            kept=$RESULTS/mutants-shard-$n
            if [ -n "$(ls -A "$kept" 2>/dev/null)" ]; then
              cp -R "$kept" shards/
            fi
          done
          mkdir -p all
          for outcome in caught missed timeout unviable; do
            cat shards/*/"$outcome.txt" 2>/dev/null | sort >"all/$outcome.txt" || true
          done
          count() { grep -c . "all/$1.txt" || true; }
          tested=$(( $(count caught) + $(count missed) + $(count timeout) + $(count unviable) ))
          # A shard that finished writes its marker; a stopped one uploads what it reached
          # without it.
          reported=$(find shards -mindepth 2 -maxdepth 2 -name shard 2>/dev/null | wc -l)
          # Each shard's outcomes against the mutants it planned (cargo-mutants' mutants.json):
          # a shard whose baseline failed tests none of them and reports no miss, so a run
          # with no misses is complete only if every shard tested all it planned. The
          # incomplete ones are listed in all/incomplete.txt (in the `mutants` artifact).
          planned_of() {
            jq length "$1" 2>/dev/null ||
              python3 -I -c 'import json, sys; print(len(json.load(open(sys.argv[1]))))' "$1" 2>/dev/null
          }
          : >all/incomplete.txt
          # The files given that match nothing in the tree, by each shard that had no mutants.
          : >all/unmatched.txt
          # The shards that had no mutants to test (no list, or an empty one), and of them those
          # whose files given were checked against the tree (.github/mutants-none.sh).
          none=0
          checked=0
          # Every planned shard, not only those that uploaded: one cancelled while queued, or
          # whose runner was lost, uploads nothing, and one that failed before cargo-mutants
          # (a build, OCCT) uploads only its threads.
          for ((n = 0; n < SHARDS; n++)); do
            dir=shards/mutants-shard-$n
            if [ ! -d "$dir" ]; then
              echo "shard $n reported nothing (never started, its runner was lost, or its artifact didn't upload)" >>all/incomplete.txt
              continue
            fi
            # A shard with no mutants to test says so once its cargo-mutants has ended well
            # (.github/mutants-none.sh), never one that stopped, naming each file given that
            # isn't in the tree.
            if [ -f "$dir/none" ]; then
              cat "$dir/none" >>all/unmatched.txt
              checked=$((checked + 1))
            fi
            # With --in-diff, cargo-mutants writes no list when the change holds no mutants:
            # the marker says that shard ended well.
            if [ ! -s "$dir/mutants.json" ] && [ -f "$dir/none" ]; then
              none=$((none + 1))
              continue
            fi
            # Otherwise it writes its list (an empty one for no mutants) before it tests.
            if [ ! -s "$dir/mutants.json" ]; then
              echo "shard $n stopped before cargo-mutants listed its mutants (see the shard's log)" >>all/incomplete.txt
              continue
            fi
            planned=$(planned_of "$dir/mutants.json" || true)
            if ! [[ $planned =~ ^[0-9]+$ ]]; then
              echo "shard $n's mutants.json can't be read, so its count can't be checked" >>all/incomplete.txt
              continue
            fi
            if [ "$planned" -eq 0 ]; then none=$((none + 1)); fi
            outcomes=$(cat "$dir"/{caught,missed,timeout,unviable}.txt 2>/dev/null | grep -c . || true)
            if [ "$outcomes" -lt "$planned" ]; then
              why=""
              [ "$outcomes" -eq 0 ] && why=" (its baseline failed, or it stopped before a mutant: see log/baseline.log in the run's mutants-shard-$n artifact)"
              echo "shard $n tested $outcomes of $planned$why" >>all/incomplete.txt
            fi
          done
          # The missed and timed-out mutants .github/mutants-triaged.txt doesn't account for.
          # Its lines are "file | function | description | #PR", one per mutant argued
          # equivalent or unreachable, keyed without the line and column, which move. A key
          # missed more times than the list has it is new, and each of its misses is listed.
          awk -v list=.github/mutants-triaged.txt '
            # The key of a mutant named "file:line:col: description[ in function]".
            function key(name,   c, file, desc, at, off, j, fn, end) {
              c = index(name, ": ")
              file = substr(name, 1, c - 1)
              sub(/:[0-9]+:[0-9]+$/, "", file)
              desc = substr(name, c + 2)
              # The function follows the last " in ".
              at = 0
              off = 0
              while ((j = index(substr(desc, off + 1), " in ")) > 0) { at = off + j; off = at + 3 }
              if (at) return file " | " substr(desc, at + 4) " | " substr(desc, 1, at - 1)
              # A whole function replaced names it; outside a function, there is none.
              fn = ""
              if (desc ~ /^replace ([A-Za-z_]|<impl )/) {
                fn = substr(desc, 9)
                end = index(fn, " -> ")
                if (!end) end = index(fn, " with ")
                fn = substr(fn, 1, end - 1)
              }
              return file " | " fn " | " desc
            }
            FILENAME == list {
              if ($0 !~ /^#/ && NF) { sub(/ \| #[0-9]+[ \t]*$/, ""); triaged[$0]++ }
              next
            }
            {
              n++
              name[n] = $0 (FILENAME ~ /timeout/ ? " (timed out)" : "")
              k[n] = key($0)
              seen[k[n]]++
            }
            END { for (i = 1; i <= n; i++) if (seen[k[i]] > triaged[k[i]]) print name[i] }
          ' .github/mutants-triaged.txt all/missed.txt all/timeout.txt >all/new.txt
          sort -o all/new.txt all/new.txt
          {
            echo "## Mutants${FILLER:+ (filler $FILLER)}: $REF${BASE:+ since $BASE}${PACKAGES:+ ($PACKAGES)}${FILES:+ in $FILES}${RE:+ matching \`$RE\`}"
            echo
            echo "Tests: ${TESTS:-every workspace test}${TESTS_WHY:+ ($TESTS_WHY)}"
            echo
            echo "| Caught | Missed | Timed out | Unviable | New misses | Shards reported |"
            echo "|---|---|---|---|---|---|"
            echo "| $(count caught) | $(count missed) | $(count timeout) | $(count unviable) | $(count new) | $reported of $SHARDS |"
            if [ -s all/incomplete.txt ]; then
              echo
              echo "### INCOMPLETE: not every mutant was tested, so a zero miss count here is not a pass"
              sed 's/^/- /' all/incomplete.txt
            elif [ "$none" -eq "$SHARDS" ] && [ ! -s all/unmatched.txt ]; then
              echo
              echo "No mutants: cargo-mutants found nothing to mutate${FILES:+ in $FILES}${BASE:+ (the change since $BASE)}${RE:+ matching \`$RE\`}"
            fi
            if [ -s all/unmatched.txt ]; then
              echo
              echo "### Files given that match nothing in the tree"
              sort -u all/unmatched.txt | sed 's/^/- /'
            fi
            # Each shard's threads, as its Mutants step chose them.
            if compgen -G 'shards/*/threads' >/dev/null; then
              echo
              for threads in $(printf '%s\n' shards/*/threads | sort -V); do
                shard=${threads#shards/mutants-shard-}
                echo "- Shard ${shard%/threads}: $(cat "$threads")"
              done
            fi
            if [ -s all/new.txt ]; then
              echo
              echo "### New misses (missed or timed out, not in .github/mutants-triaged.txt)"
              echo '```'
              cat all/new.txt
              echo '```'
            fi
            # A recheck (a regex) is small: list what it tested, so a survivor its regex
            # missed shows by its absence.
            listed="missed timeout"
            if [ -n "$RE" ]; then listed="missed timeout caught unviable"; fi
            for outcome in $listed; do
              if [ -s "all/$outcome.txt" ]; then
                echo
                echo "### ${outcome^}"
                echo '```'
                cat "all/$outcome.txt"
                echo '```'
              fi
            done
          } >>"$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          # A filler run is cut off by design and may test a slice with no mutants: it fails
          # only on new misses, which are what someone has to look at.
          if [ -n "$FILLER" ]; then
            if [ "$SHARD_RESULT" != success ] || [ "$reported" -ne "$SHARDS" ]; then
              echo "::notice::a filler run, cut off or cancelled: the results are partial"
            fi
            if [ -s all/new.txt ]; then
              head -n 20 all/new.txt | while read -r line; do echo "::error::new miss: $line"; done
              echo "::error::$(count new) new misses: mutants missed or timed out that .github/mutants-triaged.txt doesn't hold"
              exit 1
            fi
            exit 0
          fi
          if [ -s all/incomplete.txt ]; then
            while read -r line; do echo "::error::INCOMPLETE: $line"; done <all/incomplete.txt
            exit 1
          fi
          if [ "$SHARD_RESULT" != success ] || [ "$reported" -ne "$SHARDS" ]; then
            # A shard stopped mid-mutant may list that mutant as caught by a test it killed.
            echo "::error::INCOMPLETE: a shard failed or didn't report, and a stopped shard's caught list may hold a mutant whose tests were killed"
            exit 1
          fi
          # cargo-mutants passes a run that finds no mutants: a misspelt file or regex would
          # pass having tested nothing. Each shard that had none checked the files given
          # against the tree (.github/mutants-none.sh), so a file that isn't there fails, while
          # files that are there and hold nothing to mutate pass, the summary saying so: a
          # change to data only (run 43831530760), or, with a base, one that touches none of
          # them. A shard that didn't check (no marker) can't waive it. A regex can't be
          # checked so, and one that matches nothing fails.
          if [ -s all/unmatched.txt ]; then
            sort -u all/unmatched.txt | while read -r line; do echo "::error::$line"; done
            echo "::error::the files given matched no mutants: check each is a path from the repository's root"
            exit 1
          fi
          if [ -n "$RE" ] && [ "$tested" -eq 0 ]; then
            echo "::error::the regex matched no mutants${BASE:+ changed since $BASE}: check it matches mutants' names (file:line:column: what was replaced) in the files and packages given"
            exit 1
          fi
          if [ -n "$FILES" ] && [ "$tested" -eq 0 ] && [ "$checked" -ne "$SHARDS" ]; then
            echo "::error::the files matched no mutants${BASE:+ changed since $BASE}: check each file is a path from the repository's root in the packages given"
            exit 1
          fi
          if [ "$tested" -eq 0 ]; then
            echo "::notice::no mutants: cargo-mutants found nothing to mutate${FILES:+ in $FILES}${BASE:+ (the change since $BASE)}"
          fi
          if [ -s all/missed.txt ]; then
            # Each miss as an annotation too, so `gh run view` lists them (up to 20; the
            # summary's log has them all).
            head -n 20 all/missed.txt | while read -r line; do echo "::error::missed: $line"; done
            echo "::error::$(count missed) mutants missed"
            exit 1
          fi
      # The run's outcome lists, as the summary above shows them, for `gh run download -n
      # mutants`. An upload that fails fails nothing.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: mutants
          path: all
          retention-days: 14
