# The filler's clock: it starts the filler (.github/workflows/filler.yml) every 15 minutes.
# GitHub throttles scheduled workflows (the filler's `*/15` fired four times in a day), and
# a run started with GITHUB_TOKEN triggers no `workflow_run`, so neither keeps the filler
# going. A `workflow_dispatch` with GITHUB_TOKEN does start a run, so each clock run starts
# the filler, waits, and starts the next clock run: one chain, with no token but the job's.
# Its own schedule, throttled as it is, restarts the chain if a run is lost. It runs on the
# runner labelled clock (silico-19), which runs nothing else, so its wait holds no runner
# other work could use.
#
# The filler also starts the clock whenever no clock run is going, so its `workflow_run`
# trigger restarts a lost chain soon after any real run ends. Both always start the chain
# on main. To stop it on purpose, disable it (`gh workflow disable filler-clock`):
# cancelling a tick doesn't, since a pending one or the schedule starts it again.
#
#   gh workflow run filler-clock.yml --ref main   (starts the chain by hand)
name: filler-clock

on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

# One tick at a time: a tick started while one waits replaces the one pending, so however
# the chain is started, it stays one chain.
concurrency:
  group: filler-clock

jobs:
  tick:
    runs-on: [self-hosted, linux, x64, clock]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: .github
      - name: Start the filler
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          . .github/gh.sh
          gh workflow run filler.yml --ref main
      # Even if starting the filler failed (the filler disabled, say): a tick that didn't
      # wait would start the next at once, and the chain would spin.
      - name: Wait
        if: ${{ !cancelled() }}
        run: sleep 840
      # Even if starting the filler failed: the chain is what keeps it going.
      - name: Start the next tick
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          . .github/gh.sh
          # A failed start would end the chain until the schedule or the filler restarts it.
          for try in 1 2 3; do
            gh workflow run filler-clock.yml --ref main && exit 0
            sleep 30
          done
          exit 1
