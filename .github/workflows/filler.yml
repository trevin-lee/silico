# The CI VM's idle time, filled with useful background work that never delays real work.
# Every 15 minutes (started by filler-clock.yml: GitHub throttles this file's schedule, which
# stays as a backstop), and whenever a mutants run or an oracle sweep someone started ends,
# one short job looks at the runners, starts at most one filler run, and exits.
#
# It starts nothing while a job asking for mutants, mutants-pr, or filler (a real run's
# shards, or a filler run's) is queued and could start: a runner of its lane is free, or
# between jobs. One queued behind a lane whose every runner is busy (a long run's shards
# waiting on its own) doesn't stop it: that CPU would sit idle meanwhile, on the runners only
# filler uses (silico-22, -23), and a real run starting cancels filler mutants as before, and
# an exploration or sweep whose runner its shards need (its plan, cancel-filler.sh); a queued
# shard of a run already going doesn't, so the shards it starts count filler's CPU as spare
# when they choose their threads (.github/shard-threads.sh). Nor does it start while a
# mutants run or a sweep is starting (no shard or sweep job yet); a queued gate or control
# job takes other runners, so it doesn't stop filler. A filler mutants run going doesn't stop
# another: each takes what's free when it starts (2026-10-27: one at a time, a run of one
# shard kept the rest idle); but a filler sweep and filler mutants never run together. Free
# runners aren't idle CPU: the VM is saturated by about six shards. So it fills only when
# more than a fifth of the VM's CPUs are idle (over 15 seconds; this job runs on the VM),
# with as many shards as the idle CPUs feed at a filler shard's share (a quarter of the VM)
# and the free runners labelled filler (silico-5 to -12, -22 and -23) hold. Filler shards run
# only there, at the idle scheduling class on runners whose cgroups are at the idle CPU
# weight (mutants.yml), so they hold no runner a gate could use and take no CPU a gate wants.
# In order:
#   a. Main's new commits: mutants in what main changed in its source since the commit the
#      last filler `a` run tested (or since main's parent, at first).
#   c. Every four hours: the oracle sweep, with a new seed (its run number). Once a day at
#      least: a sweep overdue (none in a day but those cancelled) goes before a and b,
#      whatever CPU is idle, filler mutants cancelled to make room, but never while a gate or
#      a real mutants run is starting or waiting for a runner it could take, nor beside an
#      exploration.
#   b. Otherwise the next slice of the workspace's source (crates/*/src/**/*.rs in path
#      order, as many files as fit in 24 KiB, or one larger file), after the last filler
#      `b` run's, wrapping around.
#
# Its state is the runs it started, on its own branch: their titles start "filler a
# <commit>", "filler b<k>", or "filler oracle sweep" (mutants.yml, oracle-sweep.yml). Every
# run started counts as done, going or finished, so two runs never take the same work and
# the rotation never stalls on a slice that's always cut off or cancelled; what one run
# didn't reach, later turns do (shards test in random order).
# Filler mutants runs stop after an hour and fail only on misses not in
# .github/mutants-triaged.txt. Real work (a real mutants run, the bench, the nightly sweep)
# cancels them first (.github/cancel-filler.sh), from a runner labelled control
# (silico-13, -14), which runs only short jobs.
# The proptest exploration (proptest-explore.yml) is filler too, started by its own schedule
# when there's room (.github/proptest-room.sh, these rules for one run), and cancelled by
# real work as a filler sweep is: one starting holds this back as a mutants run starting
# does, and a sweep due waits for one going to end, as it waits for filler mutants. Each has a
# once-a-day minimum, overdue after a day without one, which goes on a busy VM (the sweep
# here, c; the exploration, proptest-room.sh); both overdue, the sweep goes first. The bench
# and a night's sweep cancel either, as they cancel every filler run; a real mutants run
# starting cancels one overdue only if its shards would wait for a runner the one holds or
# would take (cancel-filler.sh), since on a busy VM real runs start several times a day, and
# cancelled by each, the minimum would never be met.
#
#   gh workflow run filler.yml --ref main -f dry=true   (says what it would start)
name: filler

on:
  schedule:
    - cron: "*/15 * * * *"
  # When a run ends, its runners are free.
  workflow_run:
    workflows: [mutants, oracle-sweep, proptest-explore]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry:
        description: "Only say what it would start"
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

# One decision at a time. A workflow_run of a fork's run (skipped, below) is a group of its
# own, so it never displaces the decision waiting its turn.
concurrency:
  group: filler${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_repository.full_name != github.repository && '-fork' || '' }}

jobs:
  fill:
    # A workflow_run fires for a run of any workflow by these names, a fork's pull request's
    # included (a fork can name one of its own "mutants"): only this repository's own runs
    # count. Nothing of the run's is read either way: this file and its checkout are main's.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository }}
    # On a runner labelled control (silico-13, -14), for short jobs only.
    runs-on: [self-hosted, linux, x64, control]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: .github
      - name: Fill
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY: ${{ inputs.dry || false }}
          # Filler runs use the workflows on the branch this runs on (main, when scheduled).
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          . .github/gh.sh
          # Runners labelled filler, the only ones filler shards and sweeps run on: silico-9 to
          # -12, which the mutants lanes share, and -22 and -23, filler's alone (2026-10-28,
          # Main), so filler can fill the idle CPU while a long run holds 9 to 12; and silico-5
          # to -8, the merge lane's since gates were capped at four (2026-10-28, Main).
          pool=10
          # A slice's source: about 80 mutants, at the workspace's 3.4 a KiB (2026-10-23).
          # A run cut off at its hour has tested a random part of its slice.
          slice_kib=24
          oracle_every=$((4 * 3600))

          # Not `say`, which on macOS speaks: a line of this pasted into a Mac's shell read it
          # aloud.
          report() { echo "$1"; echo "$1" >>"$GITHUB_STEP_SUMMARY"; }
          skip() { report "Nothing started: $1."; exit 0; }
          start() {
            local workflow=$1
            shift
            report "Starting $workflow $*"
            if [ "$DRY" = true ]; then report "(dry: not started)"; return; fi
            gh workflow run "$workflow" --ref "$BRANCH" "$@"
          }

          # The clock (filler-clock.yml) starts this every 15 minutes, a chain of its own runs.
          # If no clock run is queued, running, or waiting its turn, the chain was lost: start
          # it again (this runs whenever a real run ends, so that's soon after).
          # Best effort: a clock disabled on purpose, or GitHub not answering, mustn't stop the
          # filler deciding (a failed look counts as the clock running). Only runs its schedule
          # or a dispatch started: a fork's pull request runs its own copy of the clock, under
          # its name.
          clock=$(gh run list --workflow filler-clock.yml --limit 10 --json status,event \
            --jq '[.[] | select(.status != "completed" and (.event == "schedule" or .event == "workflow_dispatch"))]
              | length') || clock=1
          if [ "$clock" -eq 0 ]; then
            if [ "$DRY" = true ]; then
              report "The clock isn't running (dry: not started)"
            else
              gh workflow run filler-clock.yml --ref main && report "The clock wasn't running: started it" ||
                report "The clock isn't running and couldn't be started (disabled?)"
            fi
          fi

          # Every queued or running run but this one: its id, workflow file, status, title. A
          # failed look fails this, as each below does (the jobs loop's from its subshell, its
          # pipeline's last stage): nothing starts, or is cancelled, on a partial view of runs.
          active=$(for status in queued in_progress; do
            gh api "repos/$GH_REPO/actions/runs?status=$status&per_page=100" --jq \
              ".workflow_runs[] | select(.id != $GITHUB_RUN_ID)
                | [.id, (.path | ltrimstr(\".github/workflows/\")), .status, .display_title] | @tsv" || exit 1
          done)
          # Runs of this workflow are decisions like this one, and the clock's (filler-clock.yml)
          # only start them: neither is work, nor waits for a runner work could use.
          active=$(awk -F '\t' '$2 != "filler.yml" && $2 != "filler-clock.yml"' <<<"$active")
          # A bench measures times, and a night's sweep holds cases to deadlines: no filler
          # beside them, even on idle CPU (caches, memory bandwidth, SMT siblings).
          if awk -F '\t' '$2 == "bench.yml" || ($2 == "oracle-sweep.yml" && $4 !~ /^filler /) { found = 1 } END { exit !found }' <<<"$active"; then
            skip "a bench or a night's sweep is going"
          fi

          # The unfinished jobs of every run going: their status, runner, and labels. A run in
          # progress can still have jobs waiting for runners, which come first if a filler
          # runner could take them (silico-5 to -12 carry mutants-pr and filler, 9 to 12 mutants
          # too).
          # A mutants run, an oracle sweep, or a proptest exploration with no shard, sweep, or
          # explore job yet is starting (its plan, its yield, or its room, still going): a real
          # one's plan has cancelled filler and its shards will want filler's runners; a filler
          # one's jobs don't show yet as busy or queued. Either way, wait for it: marked
          # "starting".
          jobs=$(awk -F '\t' 'NF { print $1, $2 }' <<<"$active" | while read -r run workflow; do
            [ -n "$run" ] || continue
            gh api "repos/$GH_REPO/actions/runs/$run/jobs?per_page=100" --jq "
              (.jobs[] | select(.status != \"completed\")
                | [.status, (.runner_name // \"\"), (.labels // [] | join(\",\"))] | @tsv),
              (if (\"$workflow\" == \"mutants.yml\" or \"$workflow\" == \"oracle-sweep.yml\" or \"$workflow\" == \"proptest-explore.yml\")
                  and ([.jobs[].name | select(startswith(\"shard\") or startswith(\"sweep\") or startswith(\"explore\"))] | length) == 0
                then \"starting\\t\\t\" else empty end)" || exit 1
          done)
          if awk -F '\t' '$1 == "starting" { found = 1 } END { exit !found }' <<<"$jobs"; then
            skip "a mutants run, a sweep, or a proptest exploration is starting"
          fi
          # A job waiting for a runner of the mutants lanes (a real run's or a filler run's)
          # comes first only if it could start: a runner it asks for is free, or between jobs
          # (each takes one job, then registers again). One whose every runner is busy, a long
          # run's shards queued behind its own, waits whatever filler does, so filler fills the
          # idle CPU meanwhile on silico-22 and -23, which no lane uses; a real run starting
          # still cancels filler mutants there (its plan, cancel-filler.sh), though not an
          # overdue sweep, whose runner its shards can't take. Each label's runners:
          # .github/lanes.sh.
          . .github/lanes.sh
          # Runners running a job now, of any run going, by number (pve-silico-N-...).
          running=" $(awk -F '\t' '$1 == "in_progress" { if (match($2, /^pve-silico-[0-9]+-/)) { n = substr($2, 12, RLENGTH - 12); print n } }' <<<"$jobs" | tr '\n' ' ')"
          # Each queued job's labels (by awk: `read` would merge the empty runner field
          # into the next, a tab being whitespace to it).
          for label in $(awk -F '\t' '$1 != "" && $1 != "in_progress" && $1 != "starting" { n = split($3, l, ","); for (i = 1; i <= n; i++) print l[i] }' <<<"$jobs" | sort -u); do
            if free_for "$label"; then
              skip "a job asking for $label is queued, and a runner of that lane is free"
            fi
          done
          # A filler sweep and filler mutants never run together: at the idle weight each
          # runner gets an equal share, and a sweep holds cases to its own deadline (60 s a
          # conversion), which a starved case would miss, a false alarm.
          if awk -F '\t' '$2 == "oracle-sweep.yml" && $4 ~ /^filler / { found = 1 } END { exit !found }' <<<"$active"; then
            skip "a filler sweep is going"
          fi
          filler_mutants=$(awk -F '\t' '$2 == "mutants.yml" && $4 ~ /^filler /' <<<"$active" | wc -l)
          explorations=$(awk -F '\t' '$2 == "proptest-explore.yml"' <<<"$active" | wc -l)
          # The runners labelled filler that are running a job, of any run.
          busy=$(awk -F '\t' '$1 == "in_progress" && $2 ~ /^pve-silico-([5-9]|1[0-2]|2[23])-/' <<<"$jobs" | wc -l)
          # c, overdue: no filler sweep in a day but those cancelled (sweeps, .github/lanes.sh).
          # Real mutants runs can keep the VM a fifth or less idle for days (2026-11-04 and 05),
          # when the sweep due waits below for CPU that never comes: overdue, it goes now, whatever
          # CPU is idle, ahead of filler mutants, which it cancels (cancel-filler.sh, for them
          # alone), never running beside them. Never ahead of real work: a gate waiting holds it
          # back, as a real mutants run starting or with a job a free runner could take has above.
          # Nor beside a proptest exploration, which ends within its hour and a half, and starts
          # none while the sweep is overdue (proptest-room.sh). At the idle weight it shares the CPU
          # about equally with the real shards that keep the VM busy (each at the idle weight too):
          # the sweep's cases, one at a time and each well under a second (its 500 in about three
          # minutes), keep far inside Silico's 60 s deadlines and FreeCAD's half hour
          # (oracle-sweep.yml). Gates, at their full weight, can starve it, as any filler sweep.
          today=$(sweeps $((24 * 3600)) uncancelled)
          if [ "$today" -eq 0 ]; then
            if awk -F '\t' '$2 == "gate.yml" && $3 == "queued" { found = 1 } END { exit !found }' <<<"$active"; then
              skip "the oracle sweep is overdue (none in a day but those cancelled), but a gate is waiting for a runner"
            fi
            if [ "$explorations" -gt 0 ]; then
              skip "the oracle sweep is overdue (none in a day but those cancelled), waiting for a proptest exploration to end"
            fi
            # Queued for a runner, it would take the next one freed ahead of a real shard.
            if [ "$busy" -ge "$pool" ] && [ "$filler_mutants" -eq 0 ]; then
              skip "the oracle sweep is overdue (none in a day but those cancelled), but real work holds every runner labelled filler"
            fi
            report "The oracle sweep is overdue: no filler sweep in a day but those cancelled, so it starts whatever CPU is idle"
            if [ "$filler_mutants" -gt 0 ]; then
              report "Cancelling filler mutants ($filler_mutants runs) to make room for it"
              if [ "$DRY" = true ]; then report "(dry: not cancelled)"; else bash .github/cancel-filler.sh mutants.yml; fi
            fi
            start oracle-sweep.yml -f filler=true
            exit 0
          fi
          # The CPUs idle now, over 15 seconds (this job runs on the VM; the load average lags
          # minutes behind a run that just ended): idle and I/O wait over all time spent.
          cpu() { awk '/^cpu / { print $2 + $3 + $4 + $5 + $6 + $7 + $8 + $9, $5 + $6 }' /proc/stat; }
          read -r total0 idle0 < <(cpu)
          sleep 15
          read -r total1 idle1 < <(cpu)
          cpus=$(nproc)
          idle=$(( cpus * (idle1 - idle0) / (total1 - total0 > 0 ? total1 - total0 : 1) ))
          if [ $((idle * 5)) -le "$cpus" ]; then
            skip "$idle of $cpus CPUs are idle, a fifth or less"
          fi
          # A filler shard's share of the VM, as mutants.yml gives it: a quarter, at least 2.
          share=$((cpus / 4 > 2 ? cpus / 4 : 2))
          shards=$((pool - busy))
          if [ $((idle / share)) -lt "$shards" ]; then shards=$((idle / share)); fi
          if [ "$shards" -lt 1 ]; then
            skip "no room: $busy of $pool filler runners busy, $idle of $cpus CPUs idle"
          fi
          report "Room for $shards shards: $busy of $pool filler runners busy, $idle of $cpus CPUs idle"

          # The latest filler run on this branch whose title matches $1, captured as x. Every
          # run started counts, going or finished (cut off or cancelled too): so two filler
          # runs going at once never take the same work, and no slice or range is tried
          # forever (what a cut-off run didn't reach, later turns of the rotation do). Only
          # dispatched runs, as this starts them: a fork's pull request's run of its own copy
          # of mutants.yml, on a branch it calls main, can be titled as it likes.
          last() {
            gh run list --workflow mutants.yml --branch "$BRANCH" --event workflow_dispatch --limit 300 \
              --json displayTitle --jq "[.[].displayTitle | capture(\"$1\").x][0] // empty"
          }
          head=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)

          # a. What main changed in its source since the last commit a filler run tested.
          tested=$(last '^filler a mutants (?P<x>[0-9a-f]{40}) ')
          if [ "$head" != "$tested" ]; then
            base=${tested:-$(gh api "repos/$GH_REPO/commits/$head" --jq '.parents[0].sha')}
            changed=$(gh api "repos/$GH_REPO/compare/$base...$head" \
              --jq '[.files[]?.filename | select(test("^crates/[^/]+/src/.+\\.rs$"))] | length')
            if [ "$changed" -gt 0 ]; then
              start mutants.yml -f ref="$head" -f base="$base" -f shards="$shards" -f filler=a
              exit 0
            fi
            report "Main's source is unchanged since ${base:0:12}"
          fi

          # c. The oracle sweep, if no filler sweep started in the last four hours (or a day:
          # above).
          recent=$(sweeps "$oracle_every")
          # Due while filler mutants go: wait for them to end, so the sweep comes next, rather
          # than start more, which overlap and would keep it from ever coming. And for a
          # proptest exploration, which shares the CPU at the idle weight as a shard does.
          if [ "$recent" -eq 0 ]; then
            if [ "$filler_mutants" -gt 0 ] || [ "$explorations" -gt 0 ]; then
              skip "the oracle sweep is due, waiting for filler mutants or a proptest exploration to end"
            fi
            start oracle-sweep.yml -f filler=true
            exit 0
          fi

          # b. The slice after the last filler run's: main's source files in path order, as
          # many to a slice as fit in slice_kib (a larger file is a slice of its own). A
          # change in the files moves the slices' edges; the rotation goes on by number.
          mapfile -t slices < <(
            gh api "repos/$GH_REPO/git/trees/$head?recursive=1" --jq \
              '.tree[] | select(.type == "blob" and (.path | test("^crates/[^/]+/src/.+\\.rs$"))) | "\(.path) \(.size)"' |
              LC_ALL=C sort |
              awk -v limit=$((slice_kib * 1024)) '
                files != "" && size + $2 > limit { print files; files = ""; size = 0 }
                { files = files (files == "" ? "" : " ") $1; size += $2 }
                END { if (files != "") print files }'
          )
          if [ "${#slices[@]}" -eq 0 ]; then
            echo "::error::found no source files in main's tree at $head"
            exit 1
          fi
          previous=$(last '^filler b(?P<x>[0-9]+) mutants ')
          k=0
          if [ -n "$previous" ] && [ $((10#$previous + 1)) -lt "${#slices[@]}" ]; then
            k=$((10#$previous + 1))
          fi
          report "Slice $k, of 0 to $((${#slices[@]} - 1))"
          start mutants.yml -f ref="$head" -f files="${slices[$k]}" -f shards="$shards" -f filler="b$k"
