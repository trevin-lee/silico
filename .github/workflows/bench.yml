# The drag latency benchmark (crates/silico-sketch/benches/drag.rs, M3.7) on the
# self-hosted Linux runner, on request: its table in the run's summary, and the table and
# its JSON lines as an artifact. It records times; it fails on none.
#
#   gh workflow run bench.yml --ref main -f ref=<branch>
name: bench
run-name: "${{ inputs.bench || 'drag' }} bench ${{ inputs.ref || github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to measure (empty: the branch this runs on)"
        default: ""
      bench:
        description: "What to measure: drag (the sketch worker's drag latency), render (M4.6's bench: a 4096 by 4096 render on lavapipe through the worker's renderer, its time and memory), warm (M5.3's: a first rebuild with and without the workers' warm start), views (a view change's cost: NIST's CTC 02, from the corpus, drawn from an orbit of cameras through the worker's renderer), or picking (M5.7's: the renderer's frame alone, as the app draws it, on CTC 02, picking under the pointer each frame, its answer taken)"
        type: choice
        options: [drag, render, warm, views, picking]
        default: drag

permissions:
  contents: read

jobs:
  # A bench is real work, and filler shards beside it would skew its times: filler runs
  # yield to it.
  yield:
    runs-on: [self-hosted, linux, x64, control]
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/cancel-filler.sh

  drag:
    needs: yield
    # Even if the yield failed: the bench is the point.
    if: ${{ !cancelled() && (inputs.bench == 'drag' || inputs.bench == '') }}
    runs-on: [self-hosted, linux, x64, sweep]
    # A full solve a frame at the largest sizes takes seconds: each mode stops after a
    # minute, so the whole run is some minutes, after the build.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - name: Toolchains
        run: bash .github/tools.sh
      - name: Drag bench
        env:
          SILICO_DRAG_BENCH_OUT: ${{ runner.temp }}/bench/drag.jsonl
        run: |
          mkdir -p "$RUNNER_TEMP/bench"
          echo "Measuring $(git log -1 --format='%h %s')"
          pixi run occt
          set -o pipefail
          pixi run cargo bench -p silico-sketch --bench drag | tee "$RUNNER_TEMP/bench/drag.txt"
          {
            echo "## Drag latency: $(git log -1 --format='%h %s')"
            echo
            echo '```'
            sed '/^--- json$/q' "$RUNNER_TEMP/bench/drag.txt"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: drag-bench
          path: ${{ runner.temp }}/bench

  render:
    needs: yield
    # Even if the yield failed: the bench is the point.
    if: ${{ !cancelled() && inputs.bench == 'render' }}
    runs-on: [self-hosted, linux, x64, sweep]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - name: Toolchains
        run: bash .github/tools.sh
      - name: Render bench
        run: |
          echo "Measuring $(git log -1 --format='%h %s')"
          pixi run cargo build --release -p silico-render --features bench --bin silico-render-bench
          set -o pipefail
          {
            for size in 400 4096; do
              echo "--- $size"
              # Its own times and memory (VmHWM, VmRSS) are in what it writes; the shell's
              # time is the whole process's, its start and restart included.
              { time env -i PATH="$PATH" target/release/silico-render-bench "$size" --hold 5; } 2>&1
            done
            echo "--- cpu"
            grep -m1 'model name' /proc/cpuinfo
            grep -o -w -e fma -e avx2 -e avx512f /proc/cpuinfo | sort -u | tr '\n' ' '
          } | tee "$RUNNER_TEMP/render.txt"
          {
            echo "## Render bench: $(git log -1 --format='%h %s')"
            echo
            echo '```'
            cat "$RUNNER_TEMP/render.txt"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  warm:
    needs: yield
    # Even if the yield failed: the bench is the point.
    if: ${{ !cancelled() && inputs.bench == 'warm' }}
    runs-on: [self-hosted, linux, x64, sweep]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - name: Toolchains
        run: bash .github/tools.sh
      - name: Warm start bench
        run: |
          echo "Measuring $(git log -1 --format='%h %s')"
          pixi run occt
          pixi run cargo build --release -p silico-sketch --bin silico-sketch-worker
          set -o pipefail
          SILICO_SKETCH_WORKER="$PWD/target/release/silico-sketch-worker" \
            pixi run cargo bench -p silico-kernel --bench warm | tee "$RUNNER_TEMP/warm.txt"
          {
            echo "## Warm start: $(git log -1 --format='%h %s')"
            echo
            echo '```'
            grep -A4 '^first rebuild' "$RUNNER_TEMP/warm.txt"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  views:
    needs: yield
    # Even if the yield failed: the bench is the point.
    if: ${{ !cancelled() && inputs.bench == 'views' }}
    runs-on: [self-hosted, linux, x64, sweep]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - name: Toolchains
        run: bash .github/tools.sh
      - name: View change bench
        run: |
          echo "Measuring $(git log -1 --format='%h %s')"
          # CTC 02 as the corpus's nightly run (oracle-sweep.yml) left FreeCAD's B-rep of it
          # on this runner.
          part="${XDG_CACHE_HOME:-$HOME/.cache}/silico/corpus/nist/brep/nist_ctc_02_asme1_rc.stp.brep"
          if [ ! -f "$part" ]; then
            echo "no B-rep of CTC 02 at $part: run the corpus (pixi run corpus) on this runner first" >&2
            exit 1
          fi
          pixi run occt
          pixi run cargo build --release -p silico-kernel --bin silico-kernel-worker --bin silico-brep-convert
          target/release/silico-brep-convert <"$part" >"$RUNNER_TEMP/ctc02.brep"
          set -o pipefail
          {
            SILICO_KERNEL_WORKER="$PWD/target/release/silico-kernel-worker" \
              SILICO_BENCH_BREP="$RUNNER_TEMP/ctc02.brep" \
              pixi run cargo bench -p silico-render --bench views
            echo "--- cpu"
            grep -m1 'model name' /proc/cpuinfo
          } | tee "$RUNNER_TEMP/views.txt"
          {
            echo "## View change: $(git log -1 --format='%h %s')"
            echo
            echo '```'
            grep -e '^adapter' -e '^part' -e '^copies' -e '^inside' -e '^model name' "$RUNNER_TEMP/views.txt"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  picking:
    needs: yield
    # Even if the yield failed: the bench is the point.
    if: ${{ !cancelled() && inputs.bench == 'picking' }}
    runs-on: [self-hosted, linux, x64, sweep]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - name: Toolchains
        run: bash .github/tools.sh
      - name: Picking bench
        run: |
          echo "Measuring $(git log -1 --format='%h %s')"
          # CTC 02 as the corpus's nightly run (oracle-sweep.yml) left FreeCAD's B-rep of it
          # on this runner.
          part="${XDG_CACHE_HOME:-$HOME/.cache}/silico/corpus/nist/brep/nist_ctc_02_asme1_rc.stp.brep"
          if [ ! -f "$part" ]; then
            echo "no B-rep of CTC 02 at $part: run the corpus (pixi run corpus) on this runner first" >&2
            exit 1
          fi
          pixi run occt
          pixi run cargo build --release -p silico-kernel --bin silico-kernel-worker --bin silico-brep-convert
          target/release/silico-brep-convert <"$part" >"$RUNNER_TEMP/ctc02.brep"
          set -o pipefail
          {
            SILICO_KERNEL_WORKER="$PWD/target/release/silico-kernel-worker" \
              SILICO_BENCH_BREP="$RUNNER_TEMP/ctc02.brep" \
              pixi run cargo bench -p silico-render --bench picking
            echo "--- cpu"
            grep -m1 'model name' /proc/cpuinfo
          } | tee "$RUNNER_TEMP/picking.txt"
          {
            echo "## Picking: $(git log -1 --format='%h %s')"
            echo
            echo '```'
            grep -e '^adapter' -e '^part' -e '^scope' -e '^size' -e '^model name' "$RUNNER_TEMP/picking.txt"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
