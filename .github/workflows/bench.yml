# The drag latency benchmark (crates/silico-sketch/benches/drag.rs, M3.7) on the
# self-hosted Linux runner, on request: its table in the run's summary, and the table and
# its JSON lines as an artifact. It records times; it fails on none. Also, on request, the
# sketch stress reference as a commit writes it (sketch-stress): the file as an artifact, to
# compare with the committed one and another platform's before
# tests/determinism/sketch-stress-reference.json (protected) is rewritten.
#
#   gh workflow run bench.yml --ref main -f ref=<branch>
#   gh workflow run bench.yml --ref <branch> -f bench=sketch-stress -f ref=<full SHA>
name: bench
run-name: "${{ inputs.bench || 'drag' }} bench ${{ inputs.ref || github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to measure (empty: the branch this runs on)"
        default: ""
      bench:
        description: "What to measure: drag (the sketch worker's drag latency), render (M4.6's bench: a 4096 by 4096 render on lavapipe through the worker's renderer, its time and memory), warm (M5.3's: a first rebuild with and without the workers' warm start), or sketch-stress (the sketch stress reference as the commit writes it, as an artifact)"
        type: choice
        options: [drag, render, warm, sketch-stress]
        default: drag

permissions:
  contents: read

jobs:
  # A bench is real work, and filler shards beside it would skew its times: filler runs
  # yield to it.
  yield:
    runs-on: [self-hosted, linux, x64, control]
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/cancel-filler.sh

  drag:
    needs: yield
    # Even if the yield failed: the bench is the point.
    if: ${{ !cancelled() && (inputs.bench == 'drag' || inputs.bench == '') }}
    runs-on: [self-hosted, linux, x64, sweep]
    # A full solve a frame at the largest sizes takes seconds: each mode stops after a
    # minute, so the whole run is some minutes, after the build.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - name: Toolchains
        run: bash .github/tools.sh
      - name: Drag bench
        env:
          SILICO_DRAG_BENCH_OUT: ${{ runner.temp }}/bench/drag.jsonl
        run: |
          mkdir -p "$RUNNER_TEMP/bench"
          echo "Measuring $(git log -1 --format='%h %s')"
          pixi run occt
          set -o pipefail
          pixi run cargo bench -p silico-sketch --bench drag | tee "$RUNNER_TEMP/bench/drag.txt"
          {
            echo "## Drag latency: $(git log -1 --format='%h %s')"
            echo
            echo '```'
            sed '/^--- json$/q' "$RUNNER_TEMP/bench/drag.txt"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: drag-bench
          path: ${{ runner.temp }}/bench

  render:
    needs: yield
    # Even if the yield failed: the bench is the point.
    if: ${{ !cancelled() && inputs.bench == 'render' }}
    runs-on: [self-hosted, linux, x64, sweep]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - name: Toolchains
        run: bash .github/tools.sh
      - name: Render bench
        run: |
          echo "Measuring $(git log -1 --format='%h %s')"
          pixi run cargo build --release -p silico-render --features bench --bin silico-render-bench
          set -o pipefail
          {
            for size in 400 4096; do
              echo "--- $size"
              # Its own times and memory (VmHWM, VmRSS) are in what it writes; the shell's
              # time is the whole process's, its start and restart included.
              { time env -i PATH="$PATH" target/release/silico-render-bench "$size" --hold 5; } 2>&1
            done
            echo "--- cpu"
            grep -m1 'model name' /proc/cpuinfo
            grep -o -w -e fma -e avx2 -e avx512f /proc/cpuinfo | sort -u | tr '\n' ' '
          } | tee "$RUNNER_TEMP/render.txt"
          {
            echo "## Render bench: $(git log -1 --format='%h %s')"
            echo
            echo '```'
            cat "$RUNNER_TEMP/render.txt"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  warm:
    needs: yield
    # Even if the yield failed: the bench is the point.
    if: ${{ !cancelled() && inputs.bench == 'warm' }}
    runs-on: [self-hosted, linux, x64, sweep]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - name: Toolchains
        run: bash .github/tools.sh
      - name: Warm start bench
        run: |
          echo "Measuring $(git log -1 --format='%h %s')"
          pixi run occt
          pixi run cargo build --release -p silico-sketch --bin silico-sketch-worker
          set -o pipefail
          SILICO_SKETCH_WORKER="$PWD/target/release/silico-sketch-worker" \
            pixi run cargo bench -p silico-kernel --bench warm | tee "$RUNNER_TEMP/warm.txt"
          {
            echo "## Warm start: $(git log -1 --format='%h %s')"
            echo
            echo '```'
            grep -A4 '^first rebuild' "$RUNNER_TEMP/warm.txt"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  sketch-stress:
    needs: yield
    # Even if the yield failed: the reference is the point.
    if: ${{ !cancelled() && inputs.bench == 'sketch-stress' }}
    runs-on: [self-hosted, linux, x64, sweep]
    timeout-minutes: 90
    env:
      NEXTEST_PROFILE: ci
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - name: Toolchains
        run: bash .github/tools.sh
      - name: Write the reference
        env:
          OUT: ${{ runner.temp }}/sketch-stress/sketch-stress-reference-linux-x64.json
        run: |
          mkdir -p "$(dirname "$OUT")"
          echo "Writing from $(git log -1 --format='%H %s')"
          pixi run occt
          share=$(( $(nproc) / 4 > 2 ? $(nproc) / 4 : 2 ))
          export CARGO_BUILD_JOBS=$share NEXTEST_TEST_THREADS=$share CMAKE_BUILD_PARALLEL_LEVEL=$share
          SILICO_WRITE_SKETCH_STRESS="$OUT" pixi run cargo nextest run -p silico-sketch --test stress \
            -E 'test(generated_sketches_solve_to_the_references_bits)'
          git rev-parse HEAD >"$(dirname "$OUT")/commit.txt"
          {
            echo "## Sketch stress reference: $(git log -1 --format='%h %s')"
            echo
            echo "$(wc -l <"$OUT") lines; sha256 $(sha256sum "$OUT" | cut -d' ' -f1)"
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: sketch-stress-reference-linux-x64
          path: ${{ runner.temp }}/sketch-stress
