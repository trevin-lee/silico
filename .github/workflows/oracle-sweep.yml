# Silico compared with FreeCAD, nightly: 500 generated cases (docs/roadmap/m1-kernel.md,
# M1.8) from a seed that changes every run, so the nights add up to broad coverage (a
# failing night names its seed; `pixi run oracle-sweep -- --seed S` repeats it), and the
# corpus of real parts (M1.9; `pixi run corpus`), then the sketch-edit sweep and the
# sketch-extend sweep from the same seed (below). A failed night opens an issue for the
# part that failed (sweep, corpus, sketch-edit-sweep, sketch-extend-sweep, or setup),
# listing the cases a sketch sweep found differing, or comments on the open one; a green
# night closes the corpus's and setup's and comments on the sweeps' (.github/nightly-report.sh).
# The filler (filler.yml) also starts it every four hours on idle runners, as `filler: true`:
# its title then starts "filler", it runs on the runners labelled filler, it reports only a
# failure, and real work cancels it (.github/cancel-filler.sh), without a report: a bench or
# a night always, a real mutants run unless it's overdue (none in a day but those cancelled,
# filler.yml), then only if that run's shards would wait for a runner it holds or would take,
# so a busy VM still gets its day's sweep. A scheduled night cancels filler first. The
# sketch-edit sweep (`pixi run oracle-sketch-edit-sweep`: 500 generated sketches, each edited
# by Silico and by FreeCAD, docs/ports/sketch-edit.md's *The oracle*) and the sketch-extend
# sweep (`oracle-sketch-extend-sweep`, 500 extends) run each night; started by hand with
# `sketch_edits: true`, the run is those two alone. A run started by hand can name its
# `seed`, to repeat a sweep (any of them) at it; the run's title names the seed it used.
name: oracle-sweep
run-name: "${{ inputs.filler && 'filler ' || '' }}oracle ${{ inputs.sketch_edits && 'sketch-edit and extend sweep' || (github.event_name == 'schedule' && 'sweeps and corpus' || 'sweep') }}, seed ${{ inputs.seed || github.run_number }}"

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      filler:
        description: "Set only by the filler (filler.yml): a run on idle runners, which yields to real work"
        type: boolean
        default: false
      sketch_edits:
        description: "Run the sketch-edit and sketch-extend sweeps (pixi run oracle-sketch-edit-sweep, oracle-sketch-extend-sweep) instead of the sweep and the corpus"
        type: boolean
        default: false
      seed:
        description: "The sweep's seed, to run one again (empty: the run number, as a night's)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # A night is real work: filler runs yield to it.
  yield:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: [self-hosted, linux, x64, control]
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/cancel-filler.sh

  sweep:
    needs: yield
    if: ${{ !cancelled() }}
    runs-on: ${{ inputs.filler && fromJSON('["self-hosted", "linux", "x64", "filler"]') || fromJSON('["self-hosted", "linux", "x64", "sweep"]') }}
    timeout-minutes: 120
    outputs:
      sweep: ${{ steps.sweep.outcome }}
      corpus: ${{ steps.corpus.outcome }}
      edits: ${{ steps.edits.outcome }}
      edit_cases: ${{ steps.edits.outputs.cases }}
      edit_status: ${{ steps.edits.outputs.status }}
      extends: ${{ steps.extends.outcome }}
      extend_cases: ${{ steps.extends.outputs.cases }}
      extend_status: ${{ steps.extends.outputs.status }}
    steps:
      - uses: actions/checkout@v5
      - name: Toolchains
        id: toolchains
        run: bash .github/tools.sh
      - name: Sweep
        id: sweep
        if: ${{ !inputs.sketch_edits }}
        # A filler sweep runs on a runner at the idle CPU weight (mutants.yml), where gates can
        # starve it: a case's FreeCAD deadline there is half an hour, not two minutes, so a
        # starved case isn't reported as a failure. (Silico's own conversion keeps its 60 s.)
        env:
          SILICO_ORACLE_CASE_DEADLINE: ${{ inputs.filler && '1800' || '' }}
          # Through the environment, so the input is never read as the script's text.
          SEED: ${{ inputs.seed || github.run_number }}
        run: |
          echo "seed $SEED"
          pixi run oracle-sweep -- --seed "$SEED"
      - name: Corpus
        id: corpus
        if: ${{ !cancelled() && steps.toolchains.outcome == 'success' && !inputs.sketch_edits }}
        env:
          SILICO_ORACLE_CASE_DEADLINE: ${{ inputs.filler && '1800' || '' }}
        run: pixi run corpus
      # The sketch sweeps, each night and when started for them, from the same seed: each
      # runs whatever the ones before it found, but not after the toolchains failed (that's the
      # report's `setup`). Each names the cases it found differing
      # (`<sweep>_<seed>_<index>: ...` lines) for the night's report.
      - name: Sketch-edit sweep
        id: edits
        if: ${{ !cancelled() && steps.toolchains.outcome == 'success' && (inputs.sketch_edits || github.event_name == 'schedule') }}
        env:
          SILICO_ORACLE_CASE_DEADLINE: ${{ inputs.filler && '1800' || '' }}
          # Through the environment, so the input is never read as the script's text.
          SEED: ${{ inputs.seed || github.run_number }}
        run: |
          echo "seed $SEED"
          set -o pipefail
          status=0
          pixi run oracle-sketch-edit-sweep -- --seed "$SEED" 2>&1 | tee "$RUNNER_TEMP/edits.log" || status=$?
          echo "cases=$(grep -oE '^edit_[0-9]+_[0-9]+' "$RUNNER_TEMP/edits.log" | sort -u | paste -sd ' ' -)" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Sketch-extend sweep
        id: extends
        if: ${{ !cancelled() && steps.toolchains.outcome == 'success' && (inputs.sketch_edits || github.event_name == 'schedule') }}
        env:
          SILICO_ORACLE_CASE_DEADLINE: ${{ inputs.filler && '1800' || '' }}
          SEED: ${{ inputs.seed || github.run_number }}
        run: |
          echo "seed $SEED"
          set -o pipefail
          status=0
          pixi run oracle-sketch-extend-sweep -- --seed "$SEED" 2>&1 | tee "$RUNNER_TEMP/extends.log" || status=$?
          echo "cases=$(grep -oE '^extend_[0-9]+_[0-9]+' "$RUNNER_TEMP/extends.log" | sort -u | paste -sd ' ' -)" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

  report:
    needs: sweep
    # Scheduled nights, and the filler's runs that failed (not those real work cancelled):
    # a run started by hand reports to whoever started it.
    if: ${{ always() && (github.event_name == 'schedule' || (inputs.filler && needs.sweep.result == 'failure')) }}
    runs-on: [self-hosted, linux, x64, control]
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RESULT: ${{ needs.sweep.result }}
          SWEEP: ${{ needs.sweep.outputs.sweep }}
          CORPUS: ${{ needs.sweep.outputs.corpus }}
          EDITS: ${{ needs.sweep.outputs.edits }}
          EDIT_CASES: ${{ needs.sweep.outputs.edit_cases }}
          EDIT_STATUS: ${{ needs.sweep.outputs.edit_status }}
          EXTENDS: ${{ needs.sweep.outputs.extends }}
          EXTEND_CASES: ${{ needs.sweep.outputs.extend_cases }}
          EXTEND_STATUS: ${{ needs.sweep.outputs.extend_status }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SEED: ${{ inputs.seed || github.run_number }}
        run: bash .github/nightly-report.sh
