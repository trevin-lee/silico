# The gate (tests/gate.sh) on every pull request and push to main, on GitHub's hosted
# runners (ubuntu-24.04, x86-64 Linux: 4 vCPUs, 16 GB, free for a public repository). Each job
# starts on a fresh machine: .github/actions/prepare frees its disk and restores the pixi
# environments, OCCT's build, and the dependencies' build from GitHub's Actions cache, which
# only main's runs save (OCCT's, any run that missed it), so pull requests never evict
# main's caches.
name: gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  # A pull request's newer push replaces its older run; every commit on main is checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXTEST_PROFILE: ci
  # Every job builds from a fresh checkout, whose files Cargo sees as changed, and the cache
  # keeps no workspace crate: incremental compilation's caches would only be written.
  CARGO_INCREMENTAL: "0"
  # Proptest's seed isn't set here: pixi.toml's test task fixes it (PROPTEST_RNG_SEED=20261021,
  # mutants' too), so every gate meets the same cases, and a task's env wins over a workflow's.
  # New seeds are explored apart (proptest-explore.yml).

jobs:
  gate:
    # A fork's pull request is skipped here: its gate is run by pushing its head to a branch of
    # this repository, after the maintainer has read it (README.md, "Pull requests and CI").
    # This isn't the guard: a pull request runs the workflow files of its own merge commit, so
    # a fork can change this line or add a workflow of its own. The guard is the repository's
    # Actions setting that requires approval for every outside contributor's run; never
    # approve one. On GitHub's hosted runners a fork's run would get a fresh machine, a
    # read-only token, and no secrets, so running forks' gates is now safe enough to choose;
    # whether to is the maintainer's decision, and until he makes it this stays. Every other
    # workflow starts only from a schedule, a dispatch (write access), a push, or a
    # workflow_run of those, on this repository's own refs.
    #
    # A job skipped by its `if` counts as passed for a required check, so this job's check
    # ("gate") isn't what main's branch protection requires: `verdict`'s status, below, is.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    # A cold gate (no cache: OCCT, every dependency, and the tests, on 4 vCPUs) within it, under
    # GitHub's 6 hours a job.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/prepare
        with:
          rust-key: gate
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Test scratch
        run: bash .github/scratch.sh start
      # tests/gate.sh as `pixi run gate` runs it, without that task's environment, which it
      # doesn't use (each of its steps is a `pixi run` in the gate's worktree, whose
      # environments the cache restored), so the checkout needs none of its own. Every CPU is
      # the gate's: Cargo and CMake take them all by default, and nextest's ci profile too.
      - name: Gate
        run: bash tests/gate.sh
      - name: Remove the test scratch
        if: ${{ always() }}
        run: bash .github/scratch.sh end

  verdict:
    # The gate's verdict as a commit status, silico/gate, on the commit a pull request shows
    # (its head; a push's or a dispatch's own commit), which main's branch protection
    # requires. Only this job posts it, when the gate ran to an end, passed or failed (a
    # failure replaces an earlier pass on the same commit). A pull request whose gate was
    # skipped (a fork's) or cancelled before its first verdict has none: its required check
    # reads "Expected, waiting for status to be reported", and it can't be merged. A fork's
    # head gated as a branch of this repository is the same commit, so the fork's pull
    # request gets that status too. A job of its own, so the one write permission is never
    # held by the gate's build; it checks out and runs nothing from the repository.
    needs: gate
    if: ${{ always() && (needs.gate.result == 'success' || needs.gate.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Post silico/gate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STATE: ${{ needs.gate.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          printf '{"state":"%s","context":"silico/gate","description":"The gate: %s","target_url":"%s"}' \
            "$STATE" "$STATE" "$RUN_URL" |
            curl -fsS --retry 3 -X POST -o /dev/null \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              --data-binary @- "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$SHA"
          echo "silico/gate: $STATE on $SHA"
