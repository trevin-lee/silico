# The gate (tests/gate.sh) on every pull request and push to main, on the self-hosted
# runner (the Proxmox VM ci-runner, x86-64 Linux; docs/roadmap/m0-foundations.md, M0.9).
# Each job starts from an empty workspace; the runner's home keeps the toolchains, the
# OCCT build cache, pixi's package cache, and the gate's worktree with its target/.
name: gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  # A pull request's newer push replaces its older run; every commit on main is checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXTEST_PROFILE: ci
  # Each runner keeps one build (tests/committed-tree.sh); incremental compilation's caches
  # grew to about 19 GB on each (2026-10-18), for rebuilds that rarely reuse them.
  CARGO_INCREMENTAL: "0"
  # Proptest's seed isn't set here: pixi.toml's test task fixes it (PROPTEST_RNG_SEED=20261021,
  # mutants' too), so every gate meets the same cases, and a task's env wins over a workflow's.
  # New seeds are explored apart, on idle runners (proptest-explore.yml).

jobs:
  gate:
    # A fork's pull request is skipped here, so an unmodified one never reaches the
    # self-hosted runners. This isn't the guard: a pull request runs the workflow files of its
    # own merge commit, so a fork can change this line or add a workflow of its own. The guard
    # is the repository's Actions setting that requires approval for every outside
    # contributor's run; never approve one. A fork's change is gated by pushing its head to a
    # branch of this repository (README.md, "Pull requests and CI"). Every other workflow
    # starts only from a schedule, a dispatch (write access), a push, or a workflow_run of
    # those, on this repository's own refs.
    #
    # A job skipped by its `if` counts as passed for a required check, so this job's check
    # ("gate") isn't what main's branch protection requires: `verdict`'s status, below, is.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, linux, x64, pve, gate]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Toolchains
        run: bash .github/tools.sh
      - name: Test scratch
        run: bash .github/scratch.sh start
      - name: Gate
        # A quarter of the runner VM (30 vCPUs) for its builds and tests. Each gate building
        # with Cargo's default (every vCPU) and testing on 15 threads, beside other gates and
        # mutants shards, left CPU pressure averaging 25% and failed tests held to CPU time.
        # Four gates at once (silico-1 to -4, the runners labelled gate) ask for 28 threads,
        # against 240 while building before; past four, they'd oversubscribe the VM (2026-10-28).
        # Set here because a nextest profile can't say "a quarter of the CPUs" (it takes a
        # number), and Cargo has no CI-only config; CMake (OCCT, on a cache miss) takes the
        # same share. Kernel pool tests sized by the CPU count, and the linker, still burst.
        run: |
          share=$(( $(nproc) / 4 > 2 ? $(nproc) / 4 : 2 ))
          export CARGO_BUILD_JOBS=$share NEXTEST_TEST_THREADS=$share CMAKE_BUILD_PARALLEL_LEVEL=$share
          pixi run gate
      - name: Remove the test scratch
        if: ${{ always() }}
        run: bash .github/scratch.sh end

  verdict:
    # The gate's verdict as a commit status, silico/gate, on the commit a pull request shows
    # (its head; a push's or a dispatch's own commit), which main's branch protection
    # requires. Only this job posts it, when the gate ran to an end, passed or failed (a
    # failure replaces an earlier pass on the same commit). A pull request whose gate was
    # skipped (a fork's) or cancelled before its first verdict has none: its required check
    # reads "Expected, waiting for status to be reported", and it can't be merged. A fork's
    # head gated as a branch of this repository is the same commit, so the fork's pull
    # request gets that status too. A job of its own, so the one write permission is never
    # held by the gate's build; it checks out and runs nothing from the repository.
    needs: gate
    if: ${{ always() && (needs.gate.result == 'success' || needs.gate.result == 'failure') }}
    runs-on: [self-hosted, linux, x64, control]
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Post silico/gate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STATE: ${{ needs.gate.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          printf '{"state":"%s","context":"silico/gate","description":"The gate: %s","target_url":"%s"}' \
            "$STATE" "$STATE" "$RUN_URL" |
            curl -fsS --retry 3 -X POST -o /dev/null \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              --data-binary @- "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$SHA"
          echo "silico/gate: $STATE on $SHA"
