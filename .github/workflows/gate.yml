# The gate (tests/gate.sh) on every pull request and push to main, on the self-hosted
# runner (the Proxmox VM ci-runner, x86-64 Linux; docs/roadmap/m0-foundations.md, M0.9).
# Each job starts from an empty workspace; the runner's home keeps the toolchains, the
# OCCT build cache, pixi's package cache, and the gate's worktree with its target/.
name: gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  # A pull request's newer push replaces its older run; every commit on main is checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXTEST_PROFILE: ci
  # Each runner keeps one build (tests/committed-tree.sh); incremental compilation's caches
  # grew to about 19 GB on each (2026-10-18), for rebuilds that rarely reuse them.
  CARGO_INCREMENTAL: "0"
  # Proptest's seed isn't set here: pixi.toml's test task fixes it (PROPTEST_RNG_SEED=20261021,
  # mutants' too), so every gate meets the same cases, and a task's env wins over a workflow's.
  # New seeds are explored apart, on idle runners (proptest-explore.yml).

jobs:
  gate:
    # A fork's pull request is skipped here, so an unmodified one never reaches the
    # self-hosted runners. This isn't the guard: a pull request runs the workflow files of its
    # own merge commit, so a fork can change this line or add a workflow of its own. The guard
    # is the repository's Actions setting that requires approval for every outside
    # contributor's run; never approve one. A fork's change is gated by pushing its head to a
    # branch of this repository. Every other workflow starts only from a schedule, a dispatch
    # (write access), a push, or a workflow_run of those, on this repository's own refs.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, linux, x64, pve, gate]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Toolchains
        run: bash .github/tools.sh
      - name: Test scratch
        run: bash .github/scratch.sh start
      - name: Gate
        # A quarter of the runner VM (30 vCPUs) for its builds and tests. Each gate building
        # with Cargo's default (every vCPU) and testing on 15 threads, beside other gates and
        # mutants shards, left CPU pressure averaging 25% and failed tests held to CPU time.
        # Four gates at once (silico-1 to -4, the runners labelled gate) ask for 28 threads,
        # against 240 while building before; past four, they'd oversubscribe the VM (2026-10-28).
        # Set here because a nextest profile can't say "a quarter of the CPUs" (it takes a
        # number), and Cargo has no CI-only config; CMake (OCCT, on a cache miss) takes the
        # same share. Kernel pool tests sized by the CPU count, and the linker, still burst.
        run: |
          share=$(( $(nproc) / 4 > 2 ? $(nproc) / 4 : 2 ))
          export CARGO_BUILD_JOBS=$share NEXTEST_TEST_THREADS=$share CMAKE_BUILD_PARALLEL_LEVEL=$share
          pixi run gate
      - name: Remove the test scratch
        if: ${{ always() }}
        run: bash .github/scratch.sh end
