# The gate (tests/gate.sh) on every pull request and push to main, on GitHub's hosted
# runners (ubuntu-24.04, x86-64 Linux: 4 vCPUs, 16 GB, free for a public repository). Each job
# starts on a fresh machine: .github/actions/prepare frees its disk and restores the pixi
# environments, OCCT's build, and the dependencies' build from GitHub's Actions cache, which
# only main's runs save (OCCT's, any run that missed it), so pull requests never evict
# main's caches.
name: gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  # A pull request's newer push replaces its older run; every commit on main is checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXTEST_PROFILE: ci
  # Every job builds from a fresh checkout, whose files Cargo sees as changed, and the cache
  # keeps no workspace crate: incremental compilation's caches would only be written.
  CARGO_INCREMENTAL: "0"
  # Proptest's seed isn't set here: pixi.toml's test task fixes it (PROPTEST_RNG_SEED=20261021,
  # mutants' too), so every gate meets the same cases, and a task's env wins over a workflow's.
  # New seeds are explored apart (proptest-explore.yml).

jobs:
  # The gate (tests/gate.sh) in parts side by side, each on a runner of its own: `lint` with
  # the stress run, and the tests in partitions. Together they are every check `pixi run gate`
  # makes, and `verdict` posts one status for them all. One hosted gate (4 vCPUs) took about
  # 36 minutes warm, 29.5 of them in the tests (run 45408845819). Each part builds what it
  # needs from the cache's dependencies (about 3.5 minutes for the tests) rather than taking
  # one build's archive (cargo nextest archive): that build alone would take as long, before
  # an upload and a download of its binaries, so the partitions would start no sooner. Four
  # jobs a gate leave room for three or four gates beside a mutants run among the account's 20
  # (mutants.yml).
  lint:
    name: lint and stress
    # A fork's pull request is skipped here: its gate is run by pushing its head to a branch of
    # this repository, after the maintainer has read it (README.md, "Pull requests and CI").
    # This isn't the guard: a pull request runs the workflow files of its own merge commit, so
    # a fork can change this line or add a workflow of its own. The guard is the repository's
    # Actions setting that requires approval for every outside contributor's run; never
    # approve one: a fork's run on a hosted runner gets a fresh machine, a read-only token, and
    # no secrets, but its workflow files can ask for a self-hosted runner instead, and the
    # bench's is registered to this repository. Gating forks directly is the maintainer's
    # decision; until he makes it, this stays. Every other workflow starts only from a
    # schedule, a dispatch (write access), a push, or a workflow_run of those, on this
    # repository's own refs.
    #
    # A job skipped by its `if` counts as passed for a required check, so these jobs' checks
    # aren't what main's branch protection requires: `verdict`'s status, below, is.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    # A cold run (OCCT and every dependency built) within it.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/prepare
        with:
          rust-key: gate-lint
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # tests/gate.sh as `pixi run gate` runs it, without that task's environment, which it
      # doesn't use (each of its steps is a `pixi run` in the gate's worktree, whose
      # environments the cache restored), so the checkout needs none of its own. Every CPU is
      # the job's: Cargo and CMake take them all by default, and nextest's ci profile too.
      - name: Lint
        run: bash tests/gate.sh lint
      # Even after a lint failure, so one run reports both.
      - name: Stress
        if: ${{ !cancelled() }}
        run: bash tests/gate.sh stress

  test:
    name: test (${{ matrix.partition }} of ${{ strategy.job-total }})
    # A fork's pull request is skipped here: its gate is run by pushing its head to a branch of
    # this repository, after the maintainer has read it (README.md, "Pull requests and CI").
    # This isn't the guard: a pull request runs the workflow files of its own merge commit, so
    # a fork can change this line or add a workflow of its own. The guard is the repository's
    # Actions setting that requires approval for every outside contributor's run; never
    # approve one: a fork's run on a hosted runner gets a fresh machine, a read-only token, and
    # no secrets, but its workflow files can ask for a self-hosted runner instead, and the
    # bench's is registered to this repository. Gating forks directly is the maintainer's
    # decision; until he makes it, this stays. Every other workflow starts only from a
    # schedule, a dispatch (write access), a push, or a workflow_run of those, on this
    # repository's own refs.
    #
    # A job skipped by its `if` counts as passed for a required check, so these jobs' checks
    # aren't what main's branch protection requires: `verdict`'s status, below, is.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    # A cold gate's share (OCCT, every dependency, and a third of the tests) within it.
    timeout-minutes: 180
    strategy:
      # Every partition to its end, so one run reports every failing test.
      fail-fast: false
      matrix:
        partition: [1, 2, 3]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Saved by one partition only, so the three don't race to save the same key. The
      # proptest exploration and the oracle sweep restore it too.
      - uses: ./.github/actions/prepare
        with:
          rust-key: gate
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.partition == 1 }}
      - name: Test scratch
        run: bash .github/scratch.sh start
      # nextest's count partition: test K of every N in each binary, so each share holds
      # some of every crate's tests, the slow ones spread with the rest.
      - name: Test
        env:
          PARTITION: count:${{ matrix.partition }}/${{ strategy.job-total }}
        run: bash tests/gate.sh test "$PARTITION"
      - name: Remove the test scratch
        if: ${{ always() }}
        run: bash .github/scratch.sh end

  verdict:
    # The gate's verdict as a commit status, silico/gate, on the commit a pull request shows
    # (its head; a push's or a dispatch's own commit), which main's branch protection
    # requires. Only this job posts it, once for every part of the gate: failure if any part
    # failed, success if every part passed (a failure replaces an earlier pass on the same
    # commit). A gate skipped (a fork's) or cancelled with no part failed posts nothing: its
    # pull request's required check reads "Expected, waiting for status to be reported", and
    # it can't be merged. A fork's head gated as a branch of this repository is the same
    # commit, so the fork's pull request gets that status too. A job of its own, so the one
    # write permission is never held by the gate's build; it checks out and runs nothing from
    # the repository.
    needs: [lint, test]
    if: ${{ always() && (contains(needs.*.result, 'failure') || (needs.lint.result == 'success' && needs.test.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Post silico/gate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STATE: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          printf '{"state":"%s","context":"silico/gate","description":"The gate: %s","target_url":"%s"}' \
            "$STATE" "$STATE" "$RUN_URL" |
            curl -fsS --retry 3 -X POST -o /dev/null \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              --data-binary @- "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$SHA"
          echo "silico/gate: $STATE on $SHA"
