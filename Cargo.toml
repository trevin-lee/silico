[workspace]
resolver = "3"
members = ["crates/*"]
# The OCCT math shim is a standalone crate with its own profile.
exclude = ["third_party"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
silico-core = { path = "crates/silico-core" }
silico-protocol = { path = "crates/silico-protocol" }
silico-kernel = { path = "crates/silico-kernel" }
silico-oracle = { path = "crates/silico-oracle" }
silico-worker = { path = "crates/silico-worker" }
silico-mcp = { path = "crates/silico-mcp" }
silico-render = { path = "crates/silico-render" }
cxx = "1.0"
cxx-build = "1.0"
serde = { version = "1.0", features = ["derive"] }
# float_roundtrip: every build parses floats exactly (jsonschema, a dev-dependency, turns it
# on, so builds with and without it would otherwise parse FreeCAD's numbers differently).
# preserve_order: a `Value`'s keys keep the order they were put in, in every build. Without
# it, their order depends on whether something else in the build turns the feature on (Cargo
# unifies features), so the same code wrote `check --json`'s lines and MCP's `initialize`
# in another order in the workspace's build than in one crate's (M4.9). Output is still
# written from structs or sorted (`document::sorted`); this makes a `Value` that slips
# through the same everywhere. Numbers are untouched (no arbitrary_precision: decision 23).
serde_json = { version = "1.0", features = ["float_roundtrip", "preserve_order"] }
schemars = "1.0"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
serde_bytes = "0.11"
proptest = "1.7"
# Thread CPU time, for test deadlines a loaded machine can't fail (dev only).
cpu-time = "1.0"
# Checks documents against the published schema, as an agent's validator would (dev only).
jsonschema = { version = "0.58", default-features = false }
# A test's own directory, removed when dropped, also when it fails (dev only; proptest
# already depends on it).
tempfile = "3.27"
stats_alloc = "0.1"
command-fds = "0.3"
socket2 = "0.6"
rustix = { version = "1.1", features = ["event", "net"] }
crc32fast = "1.4"
# Recompute's keys (and the cache's, from M2.5): a hash with no collisions to plan around.
sha2 = "0.10"
# The cache seals its entries with a secret of the user's, so only they could have written one.
hmac = "0.12"
# The math OCCT uses (its libm shim's, pinned alike), where Silico must compute as it does.
libm = { version = "=0.2.16", default-features = false }
libc = "0.2"
# Debug views of geometry until the app exists: the logging SDK only, not the viewer.
rerun = { version = "=0.38.1", default-features = false, features = ["sdk"] }
# Rerun's renderer, the one M5's viewport grows from, pinned with the Rerun SDK above
# (silico-render; docs/design/m4.6-render.md, R1). Its importers are off: nothing reads a
# mesh file with it.
re_renderer = { version = "=0.38.1", default-features = false }
# wgpu as re_renderer uses it, with Vulkan (lavapipe) and Metal, and Vulkan's portability
# enumeration so lavapipe is found on macOS.
wgpu = { version = "30", default-features = false, features = ["vulkan", "vulkan-portability", "metal", "wgsl", "std"] }
# The app's window, docking, and tests (docs/study/toolkit.md; M5 decision 11), at the
# versions re_ui 0.38.1 pins, so one wgpu serves the viewport and the UI. eframe's own wgpu
# features off (wgpu_no_default_features): the workspace's wgpu above chooses the backends.
# Its default fonts off too: the app's fonts are silico-font's, Inter and JetBrains Mono.
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "wgpu_no_default_features", "wayland", "x11"] }
egui_tiles = "=0.17.1"
# Its SVG loader alone (resvg, offline, no text): the app's icons.
egui_extras = { version = "=0.36.2", default-features = false, features = ["svg"] }
# Drives the app through its accessibility tree in tests, with no GPU (dev only).
egui_kittest = "=0.36.2"
silico-font = { path = "crates/silico-font" }
# The app's native file dialogs (Open, Save As, Export's path): macOS's NSOpenPanel and
# NSSavePanel, and on Linux the XDG desktop portal over D-Bus (libdbus loaded when it's
# used, zenity if it isn't there), never GTK. Its async API only, so the UI thread never
# waits on one. Wayland's window identifiers off: no dialog is given a parent window.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
# The platform's folder for an app's own data (the app's list of recent documents), the
# version Rerun already brings.
directories = "6.0"
glam = "0.30"
macaw = "0.30"
pollster = "0.4"
smallvec = "1"
# The render worker's PNG (silico-render), the version Rerun already brings.
png = "0.18"
tracing = "0.1"
# SIGTERM for `silico serve` (MCP's stdio shutdown), through its safe `flag::register`: no
# `unsafe` of Silico's own.
signal-hook = { version = "0.3", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[workspace.lints.rust]
# `unsafe` is allowed only in FFI crates, which opt out at the crate root.
# Attributes can lower `deny`; review catches that (the gate doesn't recheck it).
unsafe_code = "deny"

[workspace.lints.clippy]
# No panics on input paths: return structured errors instead.
# `#[test]` functions and `#[cfg(test)]` modules may still panic (clippy.toml);
# integration-test files under `tests/` may allow these lints at their top.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

# The pool hashes its worker executable when it starts (its identity, for the cache):
# unoptimized, that takes half a second on a debug worker, for every pool a test starts.
[profile.dev.package.sha2]
opt-level = 3
