[workspace]
resolver = "3"
members = ["crates/*"]
# Standalone crates with their own profiles: experiments and the OCCT math shim.
exclude = ["experiments", "third_party"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
silico-core = { path = "crates/silico-core" }
silico-protocol = { path = "crates/silico-protocol" }
silico-kernel = { path = "crates/silico-kernel" }
cxx = "1.0"
cxx-build = "1.0"

[workspace.lints.rust]
# `unsafe` is allowed only in FFI crates, which opt out at the crate root.
# Attributes can lower `deny`, so the M0.3 gate will recheck with `-F unsafe_code`.
unsafe_code = "deny"

[workspace.lints.clippy]
# No panics on input paths: return structured errors instead.
# `#[test]` functions and `#[cfg(test)]` modules may still panic (clippy.toml);
# integration-test files under `tests/` may allow these lints at their top.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
