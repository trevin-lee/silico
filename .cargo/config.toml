# Every C++ file in the build, including the cxx crate's own runtime, is compiled by the
# pinned clang against the pinned libc++ (pixi.toml). Mixing in the system compiler, or
# libstdc++ on Linux, would put two C++ standard libraries in one process. force: these
# win over the shell's own CXX, CXXFLAGS, and CXXSTDLIB; silico-kernel's build.rs rejects
# any other C++ compiler variable the cc crate reads (CXXFLAGS_<target> and the like).
# silico-kernel's build.rs adds the deterministic recipe's flags on top for its own code.
[env]
CXX = { value = ".pixi/envs/default/bin/clang++", relative = true, force = true }
CXXFLAGS = { value = "-stdlib=libc++", force = true }
CXXSTDLIB = { value = "c++", force = true }

# Link Rust binaries with mold on Linux (pinned in pixi.toml), the default cc driver still
# driving it. The gate and every mutant relink ~127 test binaries, and mold is several
# times faster than the default ld; build was about 40% of mutants time. Linux only, by the
# target triple: macOS keeps Apple's ld (lld 21 can't read the macOS 27 SDK, and mold has no
# Mach-O backend). mold is deterministic, so the stress reference stays byte-identical.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
